name: 202608300309 Current verified Atlas V9 deep-link successor

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/202608300309-current-gridatlas-v9-deep-link-successor.yml'
      - 'orchestration/202608300309-build-current-atlas-link-successor.py'
      - 'orchestration/202608300309-promote-current-atlas-link.py'
      - 'atman/202608300309-verify-current-atlas-v9-deep-link.mjs'
  workflow_dispatch:
  schedule:
    - cron: '12,42 * * * *'

permissions:
  contents: write
  actions: read

concurrency:
  group: pipelinenews-current-gridatlas-v9-successor
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  SOURCE_RELEASE_ID: 202608291447-pipelinenews
  RELEASE_ID: 202608300309-pipelinenews
  GENERATION: '202608300309'
  ATLAS_STATE_URL: https://ventusltd.github.io/gridatlas/state/live-set.json
  MINIMUM_ATLAS_GENERATION: '202608292311'
  GOLDEN_REPD_REF: '16135'
  BUILDER: orchestration/202608300309-build-current-atlas-link-successor.py
  PROMOTER: orchestration/202608300309-promote-current-atlas-link.py
  VERIFIER: atman/202608300309-verify-current-atlas-v9-deep-link.mjs
  LOCAL_URL: http://127.0.0.1:4173/202608300309-pipelinenews/
  PUBLIC_URL: https://ventusltd.github.io/pipelinenews/releases/202608300309-pipelinenews/

jobs:
  successor:
    name: Build receiver-only successor, prove exact REPD deep link and promote
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact PipelineNews source boundary
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 60
          persist-credentials: true

      - name: Resolve promotion-eligible Atlas receiver
        id: atlas
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 3 --retry-delay 2 \
            "$ATLAS_STATE_URL" -o /tmp/atlas-state.json
          python3 -m json.tool /tmp/atlas-state.json >/dev/null
          generation="$(jq -r '.generation // empty' /tmp/atlas-state.json)"
          if [[ ! "$generation" =~ ^[0-9]{12}$ ]] || (( 10#$generation < 10#$MINIMUM_ATLAS_GENERATION )); then
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo "Atlas generation $generation is below $MINIMUM_ATLAS_GENERATION; no PipelineNews mutation." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          release_id="$(jq -r '.current.release_id // empty' /tmp/atlas-state.json)"
          live_url="$(jq -r '.current.live_url // empty' /tmp/atlas-state.json)"
          source_commit="$(jq -r '.current.source_commit // empty' /tmp/atlas-state.json)"
          publication_commit="$(jq -r '.current.publication_commit // empty' /tmp/atlas-state.json)"
          test "$(jq -r '.verification.promotion_eligible // false' /tmp/atlas-state.json)" = true
          test "$(jq -r '.verification.failed_gates // 999' /tmp/atlas-state.json)" = 0
          [[ "$release_id" =~ ^[0-9]{12}-atlas-v9$ ]]
          test "$live_url" = "https://ventusltd.github.io/gridatlas/$release_id/"
          [[ "$source_commit" =~ ^[a-f0-9]{40}$ ]]
          [[ "$publication_commit" =~ ^[a-f0-9]{40}$ ]]
          curl --fail --location --silent --show-error --retry 3 --retry-delay 2 \
            "${live_url}release-manifest.json" -o /tmp/atlas-release-manifest.json
          test "$(jq -r '.release_id' /tmp/atlas-release-manifest.json)" = "$release_id"
          effective="$(curl --fail --location --silent --show-error --retry 3 --retry-delay 2 \
            --output /tmp/atlas-golden.html --write-out '%{url_effective}' \
            "${live_url}?repd_ref=${GOLDEN_REPD_REF}")"
          test "$effective" = "${live_url}?repd_ref=${GOLDEN_REPD_REF}"
          grep -q 'ventus-corev8engine.js' /tmp/atlas-golden.html
          echo 'ready=true' >> "$GITHUB_OUTPUT"
          echo "generation=$generation" >> "$GITHUB_OUTPUT"
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"
          echo "live_url=$live_url" >> "$GITHUB_OUTPUT"
          echo "source_commit=$source_commit" >> "$GITHUB_OUTPUT"
          echo "publication_commit=$publication_commit" >> "$GITHUB_OUTPUT"

      - name: Require immutable predecessor and unbuilt successor
        if: steps.atlas.outputs.ready == 'true'
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git fetch --no-tags origin main:refs/remotes/origin/main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          test -d "releases/$SOURCE_RELEASE_ID"
          test ! -e "releases/$RELEASE_ID"
          test "$(jq -r '.release_id' state/live-set.json)" = "$SOURCE_RELEASE_ID"
          test "$(jq -r '.classification' state/live-set.json)" = VERIFIED_LIVE_TIMESTAMPED_RELEASE
          test -f "$BUILDER"
          test -f "$PROMOTER"
          test -f "$VERIFIER"
          python3 -m py_compile "$BUILDER" "$PROMOTER"
          node --check "$VERIFIER"
          git diff --exit-code

      - name: Configure pinned Python
        if: steps.atlas.outputs.ready == 'true'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Configure pinned Node
        if: steps.atlas.outputs.ready == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.18.0'

      - name: Install pinned browser runtime
        if: steps.atlas.outputs.ready == 'true'
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.62.1
          npx playwright install --with-deps chromium

      - name: Build exact-data receiver-only successor
        if: steps.atlas.outputs.ready == 'true'
        env:
          ATLAS_URL: ${{ steps.atlas.outputs.live_url }}
        run: |
          set -euo pipefail
          rm -rf work
          mkdir -p work/release
          python3 "$BUILDER" \
            --source "releases/$SOURCE_RELEASE_ID" \
            --output "work/release/$RELEASE_ID" \
            --release-id "$RELEASE_ID" \
            --generation "$GENERATION" \
            --source-commit "$GITHUB_SHA" \
            --atlas-state /tmp/atlas-state.json \
            --atlas-state-url "$ATLAS_STATE_URL" \
            --minimum-atlas-generation "$MINIMUM_ATLAS_GENERATION" \
            --golden-repd-ref "$GOLDEN_REPD_REF" \
            | tee work/build-result.json
          test "$(jq -r '.classification' work/build-result.json)" = DETERMINISTIC_RECEIVER_ONLY_BUILD
          test "$(jq -r '.release_id' work/build-result.json)" = "$RELEASE_ID"
          test "$(jq -r '.atlas_release_id' work/build-result.json)" = "${{ steps.atlas.outputs.release_id }}"
          node --check "work/release/$RELEASE_ID/assets/202608291447-atlas-pointer-deep-link.mjs"
          python3 -m json.tool "work/release/$RELEASE_ID/atlas-link-manifest.json" >/dev/null
          python3 -m json.tool "work/release/$RELEASE_ID/build-manifest.json" >/dev/null
          python3 -m json.tool "work/release/$RELEASE_ID/release-manifest.json" >/dev/null
          diff -qr "releases/$SOURCE_RELEASE_ID/data" "work/release/$RELEASE_ID/data"
          (
            cd "work/release/$RELEASE_ID"
            sha256sum --check sha256sums.txt
          )

      - name: Serve and prove local PipelineNews to Atlas V9 deep link
        if: steps.atlas.outputs.ready == 'true'
        env:
          PIPELINE_URL: ${{ env.LOCAL_URL }}
          ATLAS_URL: ${{ steps.atlas.outputs.live_url }}
          MODE: local
          OUTPUT: work/202608300309-local-atlas-v9-deep-link-proof.json
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 --directory work/release >work/http.log 2>&1 &
          echo $! > work/http.pid
          for attempt in $(seq 1 60); do
            curl --fail --silent "$LOCAL_URL" >/dev/null && break
            sleep 1
          done
          node "$VERIFIER"
          test "$(jq -r '.classification' "$OUTPUT")" = VERIFIED_LOCAL_PIPELINENEWS_ATLAS_V9_DEEP_LINK
          test "$(jq -r '.expected_url' "$OUTPUT")" = "${ATLAS_URL}?repd_ref=${GOLDEN_REPD_REF}"
          test "$(jq -r '.synthetic_receiver' "$OUTPUT")" = false
          test "$(jq -r '.route_interceptions' "$OUTPUT")" = 0

      - name: Stop local server
        if: always()
        run: |
          test -f work/http.pid && kill "$(cat work/http.pid)" 2>/dev/null || true

      - name: Compare-and-swap immutable successor onto main
        if: steps.atlas.outputs.ready == 'true'
        run: |
          set -euo pipefail
          git fetch --no-tags origin main:refs/remotes/origin/main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          test ! -e "releases/$RELEASE_ID"
          cp -R "work/release/$RELEASE_ID" "releases/$RELEASE_ID"
          git add "releases/$RELEASE_ID"
          mapfile -t staged < <(git diff --cached --name-only)
          test "${#staged[@]}" -gt 10
          for path in "${staged[@]}"; do
            case "$path" in
              "releases/$RELEASE_ID"/*) ;;
              *) echo "unexpected staged path: $path" >&2; exit 1 ;;
            esac
          done
          git config user.name pipelinenews-atlas-link-release-bot
          git config user.email actions@users.noreply.github.com
          git commit -m "202608300309: publish verified Atlas V9 deep-link candidate"
          publication_commit="$(git rev-parse HEAD)"
          git push origin HEAD:main
          echo "PUBLICATION_COMMIT=$publication_commit" >> "$GITHUB_ENV"

      - name: Wait for exact candidate Pages deployment
        if: steps.atlas.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$PUBLICATION_COMMIT&per_page=50"
          status=''
          conclusion=''
          pages_run=''
          for attempt in $(seq 1 120); do
            payload="$(curl --fail --silent --show-error \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' "$api")"
            pages_run="$(printf '%s' "$payload" | jq -r '[.workflow_runs[] | select(.name == "pages build and deployment")][0].id // empty')"
            status="$(printf '%s' "$payload" | jq -r '[.workflow_runs[] | select(.name == "pages build and deployment")][0].status // empty')"
            conclusion="$(printf '%s' "$payload" | jq -r '[.workflow_runs[] | select(.name == "pages build and deployment")][0].conclusion // empty')"
            if test "$status" = completed; then
              test "$conclusion" = success
              break
            fi
            sleep 5
          done
          test -n "$pages_run"
          test "$status" = completed
          test "$conclusion" = success
          echo "CANDIDATE_PAGES_RUN_ID=$pages_run" >> "$GITHUB_ENV"
          for attempt in $(seq 1 60); do
            if curl --fail --location --silent --show-error "$PUBLIC_URL" >/dev/null; then break; fi
            sleep 3
          done

      - name: Prove public PipelineNews to Atlas V9 deep link
        if: steps.atlas.outputs.ready == 'true'
        env:
          PIPELINE_URL: ${{ env.PUBLIC_URL }}
          ATLAS_URL: ${{ steps.atlas.outputs.live_url }}
          MODE: public
          OUTPUT: work/202608300309-public-atlas-v9-deep-link-proof.json
        run: |
          set -euo pipefail
          node "$VERIFIER"
          test "$(jq -r '.classification' "$OUTPUT")" = VERIFIED_PUBLIC_PIPELINENEWS_ATLAS_V9_DEEP_LINK
          test "$(jq -r '.expected_url' "$OUTPUT")" = "${ATLAS_URL}?repd_ref=${GOLDEN_REPD_REF}"
          test "$(jq -r '.synthetic_receiver' "$OUTPUT")" = false
          test "$(jq -r '.route_interceptions' "$OUTPUT")" = 0

      - name: Build governed PipelineNews pointer
        if: steps.atlas.outputs.ready == 'true'
        run: |
          set -euo pipefail
          git fetch --no-tags origin main:refs/remotes/origin/main
          test "$(git rev-parse origin/main)" = "$PUBLICATION_COMMIT"
          mkdir -p machine-learning/proofs releases state
          cp work/202608300309-local-atlas-v9-deep-link-proof.json \
            machine-learning/proofs/202608300309-local-atlas-v9-deep-link-proof.json
          cp work/202608300309-public-atlas-v9-deep-link-proof.json \
            machine-learning/proofs/202608300309-public-atlas-v9-deep-link-proof.json
          python3 "$PROMOTER" \
            --release-dir "releases/$RELEASE_ID" \
            --release-id "$RELEASE_ID" \
            --generation "$GENERATION" \
            --source-release-id "$SOURCE_RELEASE_ID" \
            --release-source-commit "$GITHUB_SHA" \
            --publication-commit "$PUBLICATION_COMMIT" \
            --public-url "$PUBLIC_URL" \
            --public-proof machine-learning/proofs/202608300309-public-atlas-v9-deep-link-proof.json \
            --atlas-state /tmp/atlas-state.json \
            --atlas-state-url "$ATLAS_STATE_URL" \
            --minimum-atlas-generation "$MINIMUM_ATLAS_GENERATION" \
            --golden-repd-ref "$GOLDEN_REPD_REF" \
            --previous-state state/live-set.json \
            --output-state state/live-set.json \
            --output-current releases/current-v4.json \
            --output-link-contract state/atlas-v9-link-contract.json \
            | tee work/promotion-result.json
          test "$(jq -r '.classification' work/promotion-result.json)" = VERIFIED_PIPELINENEWS_ATLAS_LINK_POINTER_BUILT
          cmp state/live-set.json releases/current-v4.json
          test "$(jq -r '.release_id' state/live-set.json)" = "$RELEASE_ID"
          test "$(jq -r '.atlas_v9_receiver.release_id' state/live-set.json)" = "${{ steps.atlas.outputs.release_id }}"
          test "$(jq -r '.public_proof.synthetic_receiver' state/live-set.json)" = false
          test "$(jq -r '.public_proof.route_interceptions' state/live-set.json)" = 0

      - name: Compare-and-swap public promotion pointer onto main
        if: steps.atlas.outputs.ready == 'true'
        run: |
          set -euo pipefail
          git fetch --no-tags origin main:refs/remotes/origin/main
          test "$(git rev-parse origin/main)" = "$PUBLICATION_COMMIT"
          git add \
            machine-learning/proofs/202608300309-local-atlas-v9-deep-link-proof.json \
            machine-learning/proofs/202608300309-public-atlas-v9-deep-link-proof.json \
            releases/current-v4.json \
            state/atlas-v9-link-contract.json \
            state/live-set.json
          mapfile -t staged < <(git diff --cached --name-only | sort)
          expected=(
            machine-learning/proofs/202608300309-local-atlas-v9-deep-link-proof.json
            machine-learning/proofs/202608300309-public-atlas-v9-deep-link-proof.json
            releases/current-v4.json
            state/atlas-v9-link-contract.json
            state/live-set.json
          )
          test "${staged[*]}" = "${expected[*]}"
          git config user.name pipelinenews-atlas-link-promotion-bot
          git config user.email actions@users.noreply.github.com
          git commit -m "202608300309: promote current verified Atlas V9 deep links"
          promotion_commit="$(git rev-parse HEAD)"
          git push origin HEAD:main
          echo "PROMOTION_COMMIT=$promotion_commit" >> "$GITHUB_ENV"

      - name: Verify final public pointer and record milestone
        if: steps.atlas.outputs.ready == 'true'
        env:
          ATLAS_RELEASE_ID: ${{ steps.atlas.outputs.release_id }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            if curl --fail --location --silent --show-error \
              https://ventusltd.github.io/pipelinenews/state/live-set.json \
              -o work/public-live-set.json \
              && test "$(jq -r '.release_id' work/public-live-set.json)" = "$RELEASE_ID"; then
              break
            fi
            sleep 3
          done
          test "$(jq -r '.atlas_v9_receiver.release_id' work/public-live-set.json)" = "$ATLAS_RELEASE_ID"
          test "$(jq -r '.public_proof.receiver_url' work/public-live-set.json)" = \
            "${{ steps.atlas.outputs.live_url }}?repd_ref=${GOLDEN_REPD_REF}"
          {
            echo '## PipelineNews Atlas V9 deep-link milestone complete'
            echo
            echo "- PipelineNews: $PUBLIC_URL"
            echo "- Atlas receiver: $ATLAS_RELEASE_ID"
            echo "- Golden identity: repd_ref=$GOLDEN_REPD_REF"
            echo "- Candidate Pages run: $CANDIDATE_PAGES_RUN_ID"
            echo "- Promotion commit: $PROMOTION_COMMIT"
            echo '- Project, news and data bytes changed: 0'
          } >> "$GITHUB_STEP_SUMMARY"
