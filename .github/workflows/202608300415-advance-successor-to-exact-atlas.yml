name: 202608300415 Dispatch PipelineNews successor against exact Atlas
run-name: Dispatch exact-Atlas PipelineNews successor from ${{ github.sha }}

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/202608300415-advance-successor-to-exact-atlas.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: pipelinenews-exact-atlas-successor-dispatch
  cancel-in-progress: false

env:
  ATLAS_STATE_URL: https://ventusltd.github.io/gridatlas/state/live-set.json
  MINIMUM_ATLAS_GENERATION: '202608300453'
  TARGET_WORKFLOW: 202608300309-current-gridatlas-v9-deep-link-successor.yml

jobs:
  dispatch:
    name: Validate exact Atlas and launch governed immutable successor
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact PipelineNews boundary
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 20
          persist-credentials: false

      - name: Require exact current main
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          git fetch --no-tags origin main:refs/remotes/origin/main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          test -f ".github/workflows/$TARGET_WORKFLOW"

      - name: Require verified exact-REPD Atlas receiver
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 3 --retry-delay 2 \
            "$ATLAS_STATE_URL" -o /tmp/atlas-state.json
          python3 -m json.tool /tmp/atlas-state.json >/dev/null
          generation="$(jq -r '.generation // empty' /tmp/atlas-state.json)"
          release_id="$(jq -r '.current.release_id // empty' /tmp/atlas-state.json)"
          live_url="$(jq -r '.current.live_url // empty' /tmp/atlas-state.json)"
          [[ "$generation" =~ ^[0-9]{12}$ ]]
          (( 10#$generation >= 10#$MINIMUM_ATLAS_GENERATION ))
          test "$release_id" = "${generation}-atlas-v9"
          test "$live_url" = "https://ventusltd.github.io/gridatlas/$release_id/"
          test "$(jq -r '.verification.promotion_eligible // false' /tmp/atlas-state.json)" = true
          test "$(jq -r '.verification.failed_gates // 999' /tmp/atlas-state.json)" = 0
          test "$(jq -r '.verification.commit_lineage_attested // false' /tmp/atlas-state.json)" = true
          test "$(jq -r '.verification.exact_repd_deep_link_resolved // false' /tmp/atlas-state.json)" = true
          test "$(jq -r '.verification.exact_repd_fly_to // false' /tmp/atlas-state.json)" = true
          test "$(jq -r '.current.deep_link_receiver.identity_rule // empty' /tmp/atlas-state.json)" = EXACT_REPD_REF_ONLY
          test "$(jq -r '.current.deep_link_receiver.synthetic_receiver' /tmp/atlas-state.json)" = false
          test "$(jq -r '.current.deep_link_receiver.route_interceptions // 999' /tmp/atlas-state.json)" = 0
          echo "ATLAS_RELEASE_ID=$release_id" >> "$GITHUB_ENV"
          echo "ATLAS_LIVE_URL=$live_url" >> "$GITHUB_ENV"

      - name: Dispatch unchanged immutable PipelineNews successor
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          payload="$(jq -cn --arg ref main '{ref:$ref}')"
          curl --fail-with-body --location --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/$TARGET_WORKFLOW/dispatches" \
            --data "$payload"
          {
            echo '## PipelineNews immutable successor dispatched'
            echo
            echo "- Source main: $GITHUB_SHA"
            echo "- Atlas receiver: $ATLAS_RELEASE_ID"
            echo "- Atlas URL: $ATLAS_LIVE_URL"
            echo "- Target workflow: $TARGET_WORKFLOW"
            echo '- Product code and immutable releases changed by dispatcher: 0'
          } >> "$GITHUB_STEP_SUMMARY"
