name: Deploy PipelineNews Pages

# Automatic deployment is intentionally limited to immutable release and
# pointer outputs. Workflow-source edits require an explicit manual dispatch,
# preventing one source commit from launching obsolete promotion workflows.
on:
  push:
    branches: [main]
    paths:
      - 'releases/*-pipelinenews/**'
      - 'releases/current-v3.json'
      - 'releases/current-v4.json'
      - 'state/live-set.json'
      - 'state/atlas-v9-link-contract.json'
      - 'machine-learning/proofs/202608300309-*-atlas-v9-deep-link-proof.json'
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact main commit authorised for this deployment
        required: true
        type: string
      timestamp_folder_release:
        description: Optional immutable YYYYMMDDHHMM-pipelinenews release folder
        required: false
        default: ''
        type: string

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pipelinenews-pages-v2
  cancel-in-progress: false

jobs:
  deploy:
    uses: ./.github/workflows/202608301214-pages-v2.yml
    with:
      expected_sha: ${{ inputs.expected_sha || github.sha }}
      timestamp_folder_release: ${{ inputs.timestamp_folder_release || '' }}
