name: Deploy PipelineNews Pages
# Static public-app artifacts only; Jekyll is deliberately bypassed.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "newsv1/index.html"
      - "newsv1/scripts/**"
      - "newsv1/styles/**"
      - "newsv1/contracts/**"
      - "newsv1/data/**"
      - "newsv1/dist/**"
      - "newsv1/tests/check_newsv1.mjs"
      - "newsv1/tests/run_newsv1.sh"
      - "newsv1/MIGRATION_MANIFEST.json"
      - "newsv7/**"
      - "*-PipelineNews/**"
      - "*-pipelinenews/**"
      - "objects/**"
      - "releases/**"
      - "reports/**"
      - "attestations/**"
      - "tooling/build-202608251750-release.mjs"
      - "tooling/build-202608251929-release.mjs"
      - "tooling/templates/202608251929-app.js"
      - "tooling/templates/202608251929-app.css"
      - "tooling/poll-official-sources-v3.mjs"
      - "tests/check-202608251750-pipelinenews.mjs"
      - "tests/check-202608251929-pipelinenews.mjs"
      - "tests/browser-live-202608251929.mjs"
      - "tests/check-frozen-release-trees.sh"
      - "tests/check-current-timestamp-release.mjs"
      - "tests/check-official-source-v3.mjs"
      - "tests/fixtures/official-source-v3-collisions.json"
      - "tests/run-current-timestamp-release.sh"
      - ".github/workflows/pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    outputs:
      deploy_ready: ${{ steps.publication-gate.outputs.deploy_ready }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Verify cumulative News V7 release contract
        run: bash newsv7/tests/run_newsv7.sh

      - name: Verify current timestamp release contract
        run: bash tests/run-current-timestamp-release.sh

      - name: Stage News V1 runtime
        shell: bash
        run: |
          set -euo pipefail

          release="_site/newsv1"
          mkdir -p \
            "$release/scripts" \
            "$release/styles" \
            "$release/contracts" \
            "$release/data/v9.1" \
            "$release/data/v9.7" \
            "$release/dist"

          cp newsv1/index.html "$release/index.html"
          cp newsv1/MIGRATION_MANIFEST.json "$release/"

          # Exact browser-module closure for index.html. Legacy app modules,
          # build utilities and test harnesses are intentionally not published.
          runtime_modules=(
            scripts/app-newsv1.js
            scripts/core/plugin-host.js
            scripts/core/project-filter-v9-2.js
            scripts/core/state.js
            scripts/core/utils.js
            scripts/data/canonical-projects-newsv1-release.js
            scripts/data/canonical-projects-newsv1.js
            scripts/plugins/capacity-presentation-v9-3.js
            scripts/plugins/gauges-v9-2.js
            scripts/plugins/newspaper-newsv1-base.js
            scripts/plugins/newspaper-newsv1.js
            scripts/plugins/projects-newsv1.js
          )
          for module in "${runtime_modules[@]}"; do
            install -Dm0644 "newsv1/$module" "$release/$module"
          done

          cp \
            newsv1/styles/v7.css \
            newsv1/styles/mobile.css \
            newsv1/styles/v9-3.css \
            newsv1/styles/v9-4.css \
            newsv1/styles/v9-5-1.css \
            newsv1/styles/v9-6-1.css \
            newsv1/styles/performance-newsv1.css \
            "$release/styles/"

          cp \
            newsv1/contracts/release.newsv1.json \
            newsv1/contracts/release.v9.1.json \
            "$release/contracts/"

          cp newsv1/data/v9.1/build_manifest.json "$release/data/v9.1/"
          cp -a newsv1/data/v9.1/projects "$release/data/v9.1/"
          cp \
            newsv1/data/v9.7/regional_manifest.json \
            newsv1/data/v9.7/regional_news.json \
            "$release/data/v9.7/"
          cp newsv1/dist/major_project_news_v9_5_1.json "$release/dist/"

          release_v7="_site/newsv7"
          mkdir -p \
            "$release_v7/scripts" \
            "$release_v7/styles" \
            "$release_v7/contracts" \
            "$release_v7/data/v9.1" \
            "$release_v7/data/v9.7" \
            "$release_v7/data/newsv7" \
            "$release_v7/dist"

          cp newsv7/index.html "$release_v7/index.html"
          cp newsv7/MIGRATION_MANIFEST.json "$release_v7/"

          runtime_modules_v7=(
            scripts/app-newsv7.js
            scripts/core/plugin-host.js
            scripts/core/project-filter-v9-2.js
            scripts/core/state.js
            scripts/core/utils.js
            scripts/data/canonical-projects-newsv7-release.js
            scripts/data/canonical-projects-newsv7.js
            scripts/plugins/capacity-presentation-v9-3.js
            scripts/plugins/gauges-v9-2.js
            scripts/plugins/intelligence-newsv7.js
            scripts/plugins/newspaper-newsv7-base.js
            scripts/plugins/newspaper-newsv7.js
            scripts/plugins/projects-newsv7.js
          )
          for module in "${runtime_modules_v7[@]}"; do
            install -Dm0644 "newsv7/$module" "$release_v7/$module"
          done

          cp \
            newsv7/styles/v7.css \
            newsv7/styles/mobile.css \
            newsv7/styles/v9-3.css \
            newsv7/styles/v9-4.css \
            newsv7/styles/v9-5-1.css \
            newsv7/styles/v9-6-1.css \
            newsv7/styles/performance-newsv7.css \
            newsv7/styles/intelligence-newsv7.css \
            "$release_v7/styles/"

          cp \
            newsv7/contracts/release.newsv7.json \
            newsv7/contracts/release.v9.1.json \
            "$release_v7/contracts/"

          cp newsv7/data/v9.1/build_manifest.json "$release_v7/data/v9.1/"
          cp -a newsv7/data/v9.1/projects "$release_v7/data/v9.1/"
          cp \
            newsv7/data/v9.7/regional_manifest.json \
            newsv7/data/v9.7/regional_news.json \
            "$release_v7/data/v9.7/"
          cp \
            newsv7/data/newsv7/cumulative_intelligence.json \
            newsv7/data/newsv7/build_manifest.json \
            "$release_v7/data/newsv7/"
          cp newsv7/dist/major_project_news_v9_5_1.json "$release_v7/dist/"

          # Publish every lightweight timestamped shell plus its shared, content-addressed objects.
          while IFS= read -r timestamp_release; do
            cp -a "$timestamp_release" _site/
          done < <(find . -maxdepth 1 -mindepth 1 -type d \( -name '*-PipelineNews' -o -name '*-pipelinenews' \) -printf '%f\n' | sort)
          cp -a objects _site/
          cp -a releases _site/
          if test -d attestations; then
            cp -a attestations _site/
          fi

          pointer_path="releases/candidate.json"
          if test -f attestations/202608260159-pipelinenews-closure.json; then
            pointer_path="releases/current.json"
          fi
          current_manifest="$(jq -r '.manifest' "$pointer_path")"
          current_release="$(jq -r '.release_id' "$pointer_path")"
          test -f "$current_manifest"
          test -d "$current_release"

          # Timestamp shells may link to their governed reports. Publish only
          # the report closure declared by the current manifest.
          while IFS= read -r report_path; do
            test -f "$report_path"
            install -Dm0644 "$report_path" "_site/$report_path"
          done < <(jq -r '.proof[]? | select(.path | startswith("reports/")) | .path' "$current_manifest")

          touch _site/.nojekyll

          test -f "$release/index.html"
          test -f "$release/MIGRATION_MANIFEST.json"
          test -f "$release/scripts/app-newsv1.js"
          test -f "$release/data/v9.1/projects/part-016.json"
          test -f "$release/dist/major_project_news_v9_5_1.json"
          test -f "$release_v7/index.html"
          test -f "$release_v7/scripts/app-newsv7.js"
          test -f "$release_v7/data/newsv7/cumulative_intelligence.json"
          test -f "$release_v7/data/v9.1/projects/part-016.json"
          test -f "_site/$current_release/index.html"
          test -f "_site/$current_manifest"
          while IFS= read -r object_path; do
            test -f "_site/$object_path"
          done < <(jq -r '.objects | to_entries[] | .value.path' "$current_manifest")
          test -f _site/objects/data/sha256/3d2cd9cba8581bbc8c4e7434deb0c584d3969639a00926393cf011e2c3f8a00b.json
          ! find _site -type d \( -name tests -o -name node_modules -o -name v1-9-legacy-lessons \) -print -quit | grep -q .

      - name: Install pinned preview browser
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Browser-check staged Pages artifact before deployment
        shell: bash
        env:
          QA_SCREENSHOT_DIR: reports/browser-202608260159-preview
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 --directory _site >"$RUNNER_TEMP/pipelinenews-preview-server.log" 2>&1 &
          server_pid="$!"
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent --show-error http://127.0.0.1:4173/202608260159-pipelinenews/ >/dev/null; then
              break
            fi
            sleep 1
          done
          PIPELINENEWS_BASE_URL=http://127.0.0.1:4173 PIPELINENEWS_DEPLOY_SHA="preview-$GITHUB_SHA" node tests/browser-202608260159-pipelinenews.mjs

      - name: Upload predeployment browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipelinenews-202608260159-preview-${{ github.sha }}
          path: reports/browser-202608260159-preview
          if-no-files-found: error
          retention-days: 30

      - name: Enforce reviewed-preview publication gate
        id: publication-gate
        shell: bash
        run: |
          set -euo pipefail
          if test -f attestations/202608260159-pipelinenews-preview.json; then
            echo "deploy_ready=true" >> "$GITHUB_OUTPUT"
            echo "Reviewed preview attestation present; deployment may proceed."
          else
            echo "deploy_ready=false" >> "$GITHUB_OUTPUT"
            echo "Prepublication checkpoint only; deployment is disabled."
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: needs.build.outputs.deploy_ready == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}202608260159-pipelinenews/
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 8
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  verify-live:
    runs-on: ubuntu-latest
    needs: deploy
    timeout-minutes: 8
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4

      - name: Configure Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install pinned browser driver
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Verify exact deployed release at desktop and 390 CSS pixels
        env:
          PIPELINENEWS_BASE_URL: ${{ needs.deploy.outputs.page_url }}
          PIPELINENEWS_DEPLOY_SHA: ${{ github.sha }}
          QA_SCREENSHOT_DIR: reports/browser-202608260159
        run: node tests/browser-202608260159-pipelinenews.mjs

      - name: Upload browser evidence
        uses: actions/upload-artifact@v4
        with:
          name: pipelinenews-202608260159-browser-${{ github.sha }}
          path: reports/browser-202608260159
          if-no-files-found: error
          retention-days: 30
