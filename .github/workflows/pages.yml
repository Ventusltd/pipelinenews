name: Deploy PipelineNews Pages

# Automatic deployment is intentionally limited to immutable release and
# pointer outputs. Workflow-source edits require an explicit manual dispatch,
# preventing one source commit from launching obsolete promotion workflows.
on:
  push:
    branches: [main]
    paths:
      - 'releases/*-pipelinenews/**'
      - 'releases/current-v3.json'
      - 'releases/current-v4.json'
      - 'state/live-set.json'
      - 'state/atlas-v9-link-contract.json'
      - 'machine-learning/proofs/202608300309-*-atlas-v9-deep-link-proof.json'
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact main commit authorised for this deployment
        required: true
        type: string
      timestamp_folder_release:
        description: Optional immutable YYYYMMDDHHMM-pipelinenews release folder
        required: false
        default: ''
        type: string

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pipelinenews-pages-v2
  cancel-in-progress: false

jobs:
  classify:
    name: Classify exact release before choosing a publisher
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      release_id: ${{ steps.classify.outputs.release_id }}
      route: ${{ steps.classify.outputs.route }}
      pages_applicable: ${{ steps.classify.outputs.pages_applicable }}
      manifest_sha256: ${{ steps.classify.outputs.manifest_sha256 }}
      manifest_bytes: ${{ steps.classify.outputs.manifest_bytes }}
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ inputs.expected_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Classify release from immutable manifest
        id: classify
        shell: bash
        env:
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ inputs.expected_sha || github.sha }}
          REQUESTED_RELEASE: ${{ inputs.timestamp_folder_release || '' }}
        run: |
          set -euo pipefail
          mkdir -p reports
          args=(--repo . --github-output "$GITHUB_OUTPUT" --receipt reports/pages-release-classification.json)
          if test -n "$REQUESTED_RELEASE"; then
            args+=(--release "$REQUESTED_RELEASE")
          else
            test "$GITHUB_EVENT_NAME" = push
            args+=(--base "$BASE_SHA" --head "$HEAD_SHA")
          fi
          python3 tools/publication/pages_release_classifier.py "${args[@]}"

  validate-source-only:
    name: Validate additive source release without publishing it
    needs: classify
    if: needs.classify.outputs.route == 'source-only'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ inputs.expected_sha || github.sha }}
          persist-credentials: false

      - name: Prove additive release closure
        env:
          RELEASE_ID: ${{ needs.classify.outputs.release_id }}
        run: python3 tools/intelligence/release_builder.py --check "$RELEASE_ID"

  deploy:
    uses: ./.github/workflows/202608301214-pages-v2.yml
    with:
      expected_sha: ${{ inputs.expected_sha || github.sha }}
      timestamp_folder_release: ${{ inputs.timestamp_folder_release || '' }}
