name: Deploy PipelineNews Pages

on:
  push:
    branches: [main]
    paths:
      - releases/202608291310-pipelinenews/**
      - releases/current-v3.json
      - state/live-set.json
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact main commit authorised for this deployment
        required: true
        type: string
      timestamp_folder_release:
        description: Optional immutable YYYYMMDDHHMM-pipelinenews folder to validate and publish without pointer promotion
        required: false
        default: ""
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      deployed_sha: ${{ steps.source.outputs.sha }}
      generation: ${{ steps.release.outputs.generation }}
      release_path: ${{ steps.release.outputs.release_path }}
      release_sha256: ${{ steps.release.outputs.release_sha256 }}
      candidate_generation: ${{ steps.release.outputs.candidate_generation }}
      candidate_path: ${{ steps.release.outputs.candidate_path }}
      candidate_sha256: ${{ steps.release.outputs.candidate_sha256 }}
      candidate_verifier: ${{ steps.release.outputs.candidate_verifier }}
      timestamp_folder_release: ${{ steps.release.outputs.timestamp_folder_release }}
      timestamp_folder_path: ${{ steps.release.outputs.timestamp_folder_path }}
      timestamp_folder_index_path: ${{ steps.release.outputs.timestamp_folder_index_path }}
      timestamp_folder_index_sha256: ${{ steps.release.outputs.timestamp_folder_index_sha256 }}
      timestamp_folder_manifest_path: ${{ steps.release.outputs.timestamp_folder_manifest_path }}
      timestamp_folder_manifest_sha256: ${{ steps.release.outputs.timestamp_folder_manifest_sha256 }}
      live_pointer: ${{ steps.release.outputs.live_pointer }}
      live_pointer_sha256: ${{ steps.release.outputs.live_pointer_sha256 }}
      live_pointer_bytes: ${{ steps.release.outputs.live_pointer_bytes }}
    steps:
      - name: Checkout exact dispatch commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          # The staging gate proves the immutable candidate and authorisation
          # against their historical commits, so a shallow checkout is unsafe.
          fetch-depth: 0
          persist-credentials: false

      - name: Record exact deployment source
        id: source
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_SHA" = "$EXPECTED_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git fetch --no-tags origin refs/heads/main
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_SHA"
          echo "sha=$EXPECTED_SHA" >> "$GITHUB_OUTPUT"

      - name: Verify owner-authorisation workflow provenance
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import time
          from urllib.request import Request, urlopen

          records = sorted(Path("build/authorisations").glob("*-v8-fast-pages-authorisation.json"))
          if not records:
              print("No fast candidate authorisation is present; the staging gate will quarantine candidates.")
              raise SystemExit(0)
          if len(records) != 1:
              raise AssertionError(f"expected at most one fast candidate authorisation, found {len(records)}")

          authorisation = json.loads(records[0].read_text(encoding="utf-8"))
          run_id = authorisation.get("github_run_id")
          if not isinstance(run_id, str) or not run_id.isdigit():
              raise AssertionError("authorisation has no valid GitHub Actions run ID")
          repository = os.environ["GITHUB_REPOSITORY"]
          request = Request(
              f"https://api.github.com/repos/{repository}/actions/runs/{run_id}",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "User-Agent": "PipelineNews-Pages-Gate/1",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          run = None
          for attempt in range(30):
              with urlopen(request, timeout=20) as response:
                  run = json.load(response)
              if run.get("status") == "completed":
                  break
              if attempt == 29:
                  raise AssertionError(f"authorisation run {run_id} did not complete")
              time.sleep(2)

          expected_actor = os.environ["GITHUB_REPOSITORY_OWNER"]
          checks = {
              "conclusion": (run.get("conclusion"), "success"),
              "workflow path": (run.get("path"), ".github/workflows/authorise-v8-fast-pages.yml"),
              "source commit": (run.get("head_sha"), authorisation.get("authorisation_source_commit")),
              "repository": (run.get("repository", {}).get("full_name"), repository),
              "recorded actor": (authorisation.get("authorised_by", "").casefold(), expected_actor.casefold()),
              "run actor": (run.get("actor", {}).get("login", "").casefold(), expected_actor.casefold()),
          }
          for label, (actual, expected) in checks.items():
              if actual != expected:
                  raise AssertionError(f"authorisation {label}: expected {expected!r}, got {actual!r}")
          if run.get("event") not in {"push", "workflow_dispatch"}:
              raise AssertionError(f"unsupported owner-authorisation event: {run.get('event')!r}")
          print(json.dumps({
              "schema": "pipelinenews.v8.fast-pages-authorisation-run-proof.v1",
              "run_id": run_id,
              "workflow": run["path"],
              "event": run["event"],
              "actor": run["actor"]["login"],
              "source_commit": run["head_sha"],
              "conclusion": run["conclusion"],
          }, indent=2))
          PY

      - name: Configure Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Validate committed release and stage public closure
        id: release
        shell: bash
        env:
          TIMESTAMP_FOLDER_RELEASE: ${{ github.event_name == 'push' && '202608291310-pipelinenews' || inputs.timestamp_folder_release }}
        run: |
          set -euo pipefail
          arguments=(--generation latest --stage _site)
          if [[ -n "$TIMESTAMP_FOLDER_RELEASE" ]]; then
            [[ "$TIMESTAMP_FOLDER_RELEASE" =~ ^[0-9]{12}-pipelinenews$ ]]
            arguments+=(--timestamp-folder-release "$TIMESTAMP_FOLDER_RELEASE")
          fi
          python3 atman/202608262014-build-pages.py "${arguments[@]}"

      - name: Install pinned browser harness
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Browser-proof staged modular release
        shell: bash
        env:
          PIPELINENEWS_GENERATION: ${{ steps.release.outputs.generation }}
          PIPELINENEWS_PAGE_URL: http://127.0.0.1:4173/${{ steps.release.outputs.release_path }}
          PIPELINENEWS_DEPLOY_SHA: preview-${{ steps.source.outputs.sha }}
          PIPELINENEWS_EVIDENCE_DIR: reports/browser-${{ steps.release.outputs.generation }}-preview
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 --directory _site >"$RUNNER_TEMP/pipelinenews-preview.log" 2>&1 &
          server_pid="$!"
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent --show-error "$PIPELINENEWS_PAGE_URL" >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent --show-error "$PIPELINENEWS_PAGE_URL" >/dev/null
          node atman/202608262014-browser-proof.mjs

      - name: Browser-proof staged authorised fast candidate
        if: ${{ steps.release.outputs.candidate_path != '' }}
        shell: bash
        env:
          FAST_SITE_URL: http://127.0.0.1:4173/${{ steps.release.outputs.candidate_path }}?deployment=preview-${{ steps.source.outputs.sha }}
          FAST_SITE_VERIFIER: ${{ steps.release.outputs.candidate_verifier }}
          FAST_SITE_EVIDENCE: reports/browser-${{ steps.release.outputs.candidate_generation }}-fast-preview.json
        run: |
          set -euo pipefail
          test -n "$FAST_SITE_VERIFIER"
          test -f "$FAST_SITE_VERIFIER"
          mkdir -p reports
          python3 -m http.server 4173 --bind 127.0.0.1 --directory _site >"$RUNNER_TEMP/pipelinenews-fast-preview.log" 2>&1 &
          server_pid="$!"
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent --show-error "$FAST_SITE_URL" >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent --show-error "$FAST_SITE_URL" >/dev/null
          node "$FAST_SITE_VERIFIER" | tee "$FAST_SITE_EVIDENCE"

      - name: Browser-proof staged Atlas V9 timestamp-folder release against real receiver
        if: ${{ steps.release.outputs.timestamp_folder_path != '' }}
        shell: bash
        env:
          TIMESTAMP_FOLDER_URL: http://127.0.0.1:4173/${{ steps.release.outputs.timestamp_folder_path }}
          TIMESTAMP_FOLDER_PROOF: reports/browser-${{ steps.release.outputs.timestamp_folder_release }}-atlas-v9-preview.json
          PLAYWRIGHT_VERSION: "1.55.0"
        run: |
          set -euo pipefail
          mkdir -p reports
          python3 -m http.server 4173 --bind 127.0.0.1 --directory _site >"$RUNNER_TEMP/pipelinenews-atlas-v9-preview.log" 2>&1 &
          server_pid="$!"
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent --show-error "$TIMESTAMP_FOLDER_URL" >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent --show-error "$TIMESTAMP_FOLDER_URL" >/dev/null
          node atman/202608291310-public-browser-readback.mjs \
            --candidate "$TIMESTAMP_FOLDER_URL" \
            --output "$TIMESTAMP_FOLDER_PROOF"

      - name: Upload predeployment browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipelinenews-${{ steps.release.outputs.generation || 'unknown' }}-preview-${{ steps.source.outputs.sha || github.sha }}
          path: |
            reports/browser-*-preview
            reports/browser-*-fast-preview.json
            reports/browser-*-atlas-v9-preview.json
          if-no-files-found: warn
          retention-days: 30

      - name: Recheck exact main before packaging
        env:
          EXPECTED_SHA: ${{ steps.source.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin refs/heads/main
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_SHA"

      - name: Package checked Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}${{ needs.build.outputs.release_path }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 8
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  verify-live:
    runs-on: ubuntu-latest
    needs: [build, deploy]
    timeout-minutes: 30
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout exact deployed commit
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.build.outputs.deployed_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Configure Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install pinned browser harness
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Wait for exact deployed HTML bytes
        shell: bash
        env:
          PAGE_ROOT: ${{ needs.deploy.outputs.page_url }}
          RELEASE_PATH: ${{ needs.build.outputs.release_path }}
          EXPECTED_SHA256: ${{ needs.build.outputs.release_sha256 }}
          DEPLOYED_SHA: ${{ needs.build.outputs.deployed_sha }}
        run: |
          set -euo pipefail
          live="${PAGE_ROOT%/}/${RELEASE_PATH}?deployment=${DEPLOYED_SHA}"
          for attempt in {1..30}; do
            if curl --fail --silent --show-error --location --max-time 20 "$live" --output "$RUNNER_TEMP/live-index.html"; then
              actual="$(sha256sum "$RUNNER_TEMP/live-index.html" | cut -d' ' -f1)"
              if [[ "$actual" == "$EXPECTED_SHA256" ]]; then
                exit 0
              fi
            fi
            sleep 2
          done
          echo "Exact modular release HTML did not become observable at $live" >&2
          exit 1

      - name: Verify every deployed fast-candidate and shared-runtime byte
        if: ${{ needs.build.outputs.candidate_path != '' }}
        shell: bash
        env:
          PAGE_ROOT: ${{ needs.deploy.outputs.page_url }}
          CANDIDATE_GENERATION: ${{ needs.build.outputs.candidate_generation }}
          CANDIDATE_PATH: ${{ needs.build.outputs.candidate_path }}
          CANDIDATE_SHA256: ${{ needs.build.outputs.candidate_sha256 }}
          DEPLOYED_SHA: ${{ needs.build.outputs.deployed_sha }}
        run: |
          set -euo pipefail
          mkdir -p reports
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path, PurePosixPath
          import posixpath
          import re
          import time
          from urllib.parse import quote
          from urllib.request import Request, urlopen

          generation = os.environ["CANDIDATE_GENERATION"]
          candidate_path = os.environ["CANDIDATE_PATH"]
          expected_candidate_sha = os.environ["CANDIDATE_SHA256"]
          deployed_sha = os.environ["DEPLOYED_SHA"]
          page_root = os.environ["PAGE_ROOT"].rstrip("/")
          if not re.fullmatch(r"\d{12}", generation):
              raise AssertionError(f"invalid candidate generation: {generation!r}")
          if not re.fullmatch(r"[0-9a-f]{64}", expected_candidate_sha):
              raise AssertionError("invalid candidate SHA-256 output")

          manifest_path = Path("build") / f"{generation}-v8-fast-site-manifest.json"
          manifest_bytes = manifest_path.read_bytes()
          manifest_sha = hashlib.sha256(manifest_bytes).hexdigest()
          manifest = json.loads(manifest_bytes)
          if (
              manifest.get("schema") != "pipelinenews.v8.fast-site-candidate.v1"
              or manifest.get("generation") != generation
              or manifest.get("deployment") != "not-authorised"
          ):
              raise AssertionError("immutable fast-candidate manifest boundary changed")
          outputs = manifest.get("outputs")
          if not isinstance(outputs, list) or not outputs:
              raise AssertionError("authorised fast candidate has no declared outputs")

          authorisation_path = Path("build/authorisations") / f"{generation}-v8-fast-pages-authorisation.json"
          authorisation = json.loads(authorisation_path.read_text(encoding="utf-8"))
          if (
              authorisation.get("schema") != "pipelinenews.v8.fast-pages-authorisation.v1"
              or authorisation.get("generation") != generation
              or authorisation.get("scope") != "github-pages-immutable-candidate"
              or authorisation.get("deployment") != "authorised"
              or authorisation.get("stable_route_promoted") is not False
              or authorisation.get("globalgrid_catalogue_changed") is not False
          ):
              raise AssertionError("fast-candidate Pages authorisation boundary changed")
          expected_manifest_binding = {
              "path": manifest_path.as_posix(),
              "sha256": manifest_sha,
          }
          if authorisation.get("candidate_manifest") != expected_manifest_binding:
              raise AssertionError("authorisation does not bind the exact immutable candidate manifest")
          if authorisation.get("outputs") != outputs:
              raise AssertionError("authorisation output closure differs from the candidate manifest")
          candidate_binding = authorisation.get("candidate")
          if not isinstance(candidate_binding, dict) or candidate_binding != {
              "source_commit": manifest.get("source_commit"),
              "build_run": str(manifest.get("github_run_id")),
              "cache_identity": manifest.get("cache_identity"),
          }:
              raise AssertionError("authorisation candidate identity differs from the immutable manifest")
          canonical_outputs = json.dumps(outputs, sort_keys=True, separators=(",", ":"), ensure_ascii=False).encode()
          outputs_sha = hashlib.sha256(canonical_outputs).hexdigest()
          if (
              authorisation.get("outputs_sha256") != outputs_sha
              or authorisation.get("output_closure_sha256") != outputs_sha
          ):
              raise AssertionError("authorisation output-closure hash changed")

          candidate_manifests = {}
          candidate_owners = {}
          for path in sorted(Path("build").glob("*-v8-fast-site-manifest.json")):
              candidate_manifest = json.loads(path.read_text(encoding="utf-8"))
              candidate_generation = candidate_manifest.get("generation")
              if (
                  candidate_manifest.get("schema") != "pipelinenews.v8.fast-site-candidate.v1"
                  or not isinstance(candidate_generation, str)
                  or not re.fullmatch(r"\d{12}", candidate_generation)
                  or candidate_manifest.get("deployment") != "not-authorised"
              ):
                  raise AssertionError(f"invalid progressive candidate manifest: {path}")
              candidate_manifests[candidate_generation] = candidate_manifest
              for record in candidate_manifest.get("outputs", []):
                  relative = record.get("path")
                  if relative in candidate_owners:
                      raise AssertionError(f"candidate output has multiple owners: {relative}")
                  candidate_owners[relative] = (candidate_generation, record)
          if candidate_manifests.get(generation) != manifest:
              raise AssertionError("deployed candidate differs from the progressive manifest catalogue")

          progressive_generations = {generation}
          pending_generations = [generation]
          while pending_generations:
              current_generation = pending_generations.pop()
              for input_record in candidate_manifests[current_generation].get("inputs", []):
                  owned = candidate_owners.get(input_record.get("path"))
                  if owned is None:
                      continue
                  dependency_generation, dependency_record = owned
                  if dependency_generation >= current_generation:
                      raise AssertionError(
                          f"progressive dependency is not older: {current_generation} -> {dependency_generation}"
                      )
                  if input_record != dependency_record:
                      raise AssertionError(f"progressive dependency hash changed: {input_record.get('path')}")
                  if dependency_generation not in progressive_generations:
                      progressive_generations.add(dependency_generation)
                      pending_generations.append(dependency_generation)
          candidate_chain = sorted(progressive_generations)
          if candidate_chain != ["202608270055", "202608270844", "202608271329", "202608271524"]:
              raise AssertionError(f"unexpected progressive candidate chain: {candidate_chain}")
          progressive_outputs = [
              record
              for candidate_generation in candidate_chain
              for record in candidate_manifests[candidate_generation]["outputs"]
          ]
          if len(progressive_outputs) != 19:
              raise AssertionError(f"expected 19 progressive outputs, found {len(progressive_outputs)}")

          registry_path = f"releases/data/{generation}-v8-fast-registry.json"
          registry_records = [record for record in outputs if record.get("path") == registry_path]
          if len(registry_records) != 1:
              raise AssertionError("latest candidate has no unique registry output")
          registry = json.loads(Path(registry_path).read_text(encoding="utf-8"))
          if registry.get("generation") != generation:
              raise AssertionError("latest runtime registry generation changed")
          assets = registry.get("assets")
          if not isinstance(assets, dict) or set(assets) != {"projects", "search", "news", "chart", "style"}:
              raise AssertionError("latest runtime asset catalogue changed")
          candidate_base = posixpath.dirname(candidate_path)
          runtime_dependencies = []
          for name in ["projects", "search", "news", "chart", "style"]:
              asset = assets[name]
              relative = posixpath.normpath(posixpath.join(candidate_base, asset.get("path", "")))
              runtime_dependencies.append({
                  "path": relative,
                  "bytes": asset.get("bytes"),
                  "sha256": asset.get("sha256"),
              })
          details = registry.get("detail_partitions")
          if not isinstance(details, list) or len(details) != 16:
              raise AssertionError("latest registry must declare sixteen detail partitions")
          for detail in details:
              relative = posixpath.normpath(posixpath.join(candidate_base, detail.get("path", "")))
              runtime_dependencies.append({
                  "path": relative,
                  "bytes": detail.get("bytes"),
                  "sha256": detail.get("sha256"),
              })
          if len(runtime_dependencies) != 21:
              raise AssertionError("expected five runtime assets and sixteen detail partitions")

          records_by_path = {}
          declared_live_records = [*progressive_outputs, *runtime_dependencies]
          for record in declared_live_records:
              relative = record.get("path")
              expected_bytes = record.get("bytes")
              expected_sha = record.get("sha256")
              if not isinstance(relative, str):
                  raise AssertionError(f"unsafe deployed path: {relative!r}")
              safe_release = re.fullmatch(r"releases/[A-Za-z0-9._/-]+", relative)
              pinned_detail = re.fullmatch(
                  r"data/projects/202608261927-project-partition-v9-1-\d{2}\.json",
                  relative,
              )
              if safe_release is None and pinned_detail is None:
                  raise AssertionError(f"unsafe deployed path: {relative!r}")
              path = PurePosixPath(relative)
              if path.is_absolute() or ".." in path.parts or path.as_posix() != relative:
                  raise AssertionError(f"unsafe deployed path: {relative!r}")
              if not isinstance(expected_bytes, int) or expected_bytes < 0:
                  raise AssertionError(f"invalid byte count for {relative}")
              if not isinstance(expected_sha, str) or not re.fullmatch(r"[0-9a-f]{64}", expected_sha):
                  raise AssertionError(f"invalid SHA-256 for {relative}")
              bound = (relative, expected_bytes, expected_sha)
              previous = records_by_path.get(relative)
              if previous is not None and previous != bound:
                  raise AssertionError(f"inherited runtime binding changed: {relative}")
              records_by_path[relative] = bound

          # Candidate publication must not alter the existing stable pointer.
          stable_pointer = Path("archive/202608261547-pipelinenews/releases/current.json").read_bytes()
          records_by_path["releases/current.json"] = (
              "releases/current.json",
              len(stable_pointer),
              hashlib.sha256(stable_pointer).hexdigest(),
          )
          records = [records_by_path[relative] for relative in sorted(records_by_path)]

          candidate_records = [record for record in records if record[0] == candidate_path]
          if len(candidate_records) != 1 or candidate_records[0][2] != expected_candidate_sha:
              raise AssertionError("candidate path/SHA outputs disagree with the manifest")

          last_errors = []
          verified = []
          for attempt in range(1, 31):
              last_errors = []
              verified = []
              for relative, expected_bytes, expected_sha in records:
                  url = f"{page_root}/{quote(relative, safe='/')}?deployment={quote(deployed_sha, safe='')}"
                  try:
                      request = Request(url, headers={"Cache-Control": "no-cache", "User-Agent": "PipelineNews-Pages-Gate/1"})
                      with urlopen(request, timeout=20) as response:
                          payload = response.read()
                      actual_sha = hashlib.sha256(payload).hexdigest()
                      if len(payload) != expected_bytes or actual_sha != expected_sha:
                          raise AssertionError(
                              f"expected {expected_bytes}/{expected_sha}, got {len(payload)}/{actual_sha}"
                          )
                      verified.append({
                          "path": relative,
                          "bytes": len(payload),
                          "sha256": actual_sha,
                          "url": url,
                      })
                  except Exception as error:
                      last_errors.append(f"{relative}: {error}")
              if not last_errors:
                  break
              if attempt < 30:
                  time.sleep(2)
          else:
              raise AssertionError("deployed fast-candidate closure did not converge: " + "; ".join(last_errors))

          evidence = {
              "schema": "pipelinenews.v8.fast-pages-closure-proof.v1",
              "generation": generation,
              "deployed_sha": deployed_sha,
              "candidate_manifest": {
                  "path": manifest_path.as_posix(),
                  "sha256": manifest_sha,
                  "deployment": manifest["deployment"],
              },
              "authorisation": {
                  "path": authorisation_path.as_posix(),
                  "scope": authorisation["scope"],
                  "deployment": authorisation["deployment"],
              },
              "candidate_chain": candidate_chain,
              "candidate_output_count": len(outputs),
              "progressive_candidate_output_count": len(progressive_outputs),
              "shared_runtime_dependency_count": len(runtime_dependencies),
              "stable_pointer_unchanged": True,
              "verified_file_count": len(records),
              "outputs": verified,
              "status": "PASS",
          }
          evidence_path = Path("reports") / f"fast-live-closure-{generation}.json"
          evidence_path.write_text(json.dumps(evidence, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(evidence, indent=2))
          PY

      - name: Verify every deployed Atlas V9 timestamp-folder byte
        if: ${{ needs.build.outputs.timestamp_folder_path != '' }}
        shell: bash
        env:
          PAGE_ROOT: ${{ needs.deploy.outputs.page_url }}
          TIMESTAMP_FOLDER_RELEASE: ${{ needs.build.outputs.timestamp_folder_release }}
          TIMESTAMP_FOLDER_PATH: ${{ needs.build.outputs.timestamp_folder_path }}
          TIMESTAMP_FOLDER_MANIFEST_PATH: ${{ needs.build.outputs.timestamp_folder_manifest_path }}
          TIMESTAMP_FOLDER_MANIFEST_SHA256: ${{ needs.build.outputs.timestamp_folder_manifest_sha256 }}
          DEPLOYED_SHA: ${{ needs.build.outputs.deployed_sha }}
          LIVE_POINTER: ${{ needs.build.outputs.live_pointer }}
        run: |
          set -euo pipefail
          mkdir -p reports
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path, PurePosixPath
          import re
          import time
          from urllib.parse import quote
          from urllib.request import Request, urlopen

          release_id = os.environ["TIMESTAMP_FOLDER_RELEASE"]
          folder_path = os.environ["TIMESTAMP_FOLDER_PATH"]
          manifest_relative = os.environ["TIMESTAMP_FOLDER_MANIFEST_PATH"]
          manifest_sha = os.environ["TIMESTAMP_FOLDER_MANIFEST_SHA256"]
          deployed_sha = os.environ["DEPLOYED_SHA"]
          page_root = os.environ["PAGE_ROOT"].rstrip("/")
          if not re.fullmatch(r"\d{12}-pipelinenews", release_id):
              raise AssertionError(f"invalid timestamp folder release: {release_id!r}")
          if folder_path != f"releases/{release_id}/":
              raise AssertionError("timestamp folder path changed")
          if manifest_relative != f"releases/{release_id}/release-manifest.json":
              raise AssertionError("timestamp manifest path changed")
          if not re.fullmatch(r"[0-9a-f]{64}", manifest_sha):
              raise AssertionError("timestamp manifest SHA-256 is invalid")

          manifest_bytes = Path(manifest_relative).read_bytes()
          if hashlib.sha256(manifest_bytes).hexdigest() != manifest_sha:
              raise AssertionError("committed timestamp manifest differs from Pages build output")
          manifest = json.loads(manifest_bytes)
          if (
              manifest.get("schema") != "pipelinenews.timestamp-folder-successor.v1"
              or manifest.get("release_id") != release_id
              or manifest.get("classification") != "IMMUTABLE_TIMESTAMPED_RELEASE"
          ):
              raise AssertionError("timestamp release boundary changed")
          records = list(manifest.get("outputs", [])) + [{
              "path": manifest_relative,
              "bytes": len(manifest_bytes),
              "sha256": manifest_sha,
          }]
          if len(records) != 40:
              raise AssertionError(f"expected 40 timestamp folder files, found {len(records)}")

          verified = []
          for record in records:
              relative = record.get("path")
              expected_bytes = record.get("bytes")
              expected_sha = record.get("sha256")
              path = PurePosixPath(relative) if isinstance(relative, str) else PurePosixPath("/")
              if path.is_absolute() or ".." in path.parts or path.as_posix() != relative:
                  raise AssertionError(f"unsafe timestamp output: {relative!r}")
              if not relative.startswith(folder_path):
                  raise AssertionError(f"timestamp output escaped folder: {relative}")
              last_error = None
              for attempt in range(1, 11):
                  url = f"{page_root}/{quote(relative, safe='/')}?deployment={quote(deployed_sha, safe='')}&attempt={attempt}"
                  try:
                      request = Request(url, headers={"Cache-Control": "no-cache", "User-Agent": "PipelineNews-Pages-Gate/1"})
                      with urlopen(request, timeout=20) as response:
                          payload = response.read()
                      actual_sha = hashlib.sha256(payload).hexdigest()
                      if len(payload) != expected_bytes or actual_sha != expected_sha:
                          raise AssertionError(f"expected {expected_bytes}/{expected_sha}, got {len(payload)}/{actual_sha}")
                      verified.append({"path": relative, "bytes": len(payload), "sha256": actual_sha, "url": url})
                      break
                  except Exception as error:
                      last_error = error
                      if attempt < 10:
                          time.sleep(2)
              else:
                  raise AssertionError(f"deployed timestamp byte did not converge: {relative}: {last_error}")

          evidence = {
              "schema": "pipelinenews.timestamp-folder-pages-closure-proof.v1",
              "release_id": release_id,
              "deployed_sha": deployed_sha,
              "verified_file_count": len(verified),
              "pointer_promoted": os.environ.get("LIVE_POINTER") == "true",
              "outputs": verified,
              "status": "PASS",
          }
          evidence_path = Path("reports") / f"timestamp-folder-live-closure-{release_id}.json"
          evidence_path.write_text(json.dumps(evidence, indent=2) + "\n", encoding="utf-8")
          print(json.dumps({"status": evidence["status"], "verified_file_count": len(verified)}))
          PY

      - name: Verify both public live pointer bytes and release binding
        if: ${{ needs.build.outputs.live_pointer == 'true' }}
        shell: bash
        env:
          PAGE_ROOT: ${{ needs.deploy.outputs.page_url }}
          POINTER_SHA256: ${{ needs.build.outputs.live_pointer_sha256 }}
          POINTER_BYTES: ${{ needs.build.outputs.live_pointer_bytes }}
          DEPLOYED_SHA: ${{ needs.build.outputs.deployed_sha }}
        run: |
          set -euo pipefail
          mkdir -p reports
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import time
          from urllib.request import Request, urlopen

          expected_sha = os.environ["POINTER_SHA256"]
          expected_bytes = int(os.environ["POINTER_BYTES"])
          page_root = os.environ["PAGE_ROOT"].rstrip("/")
          deployed_sha = os.environ["DEPLOYED_SHA"]
          local_current = Path("releases/current-v3.json").read_bytes()
          local_live_set = Path("state/live-set.json").read_bytes()
          if local_current != local_live_set:
              raise AssertionError("committed live pointer copies differ")
          if len(local_current) != expected_bytes or hashlib.sha256(local_current).hexdigest() != expected_sha:
              raise AssertionError("Pages pointer outputs differ from committed bytes")

          verified = []
          payloads = []
          for relative in ["releases/current-v3.json", "state/live-set.json"]:
              last_error = None
              for attempt in range(1, 11):
                  url = f"{page_root}/{relative}?deployment={deployed_sha}&attempt={attempt}"
                  try:
                      request = Request(url, headers={"Cache-Control": "no-cache", "User-Agent": "PipelineNews-Pages-Gate/1"})
                      with urlopen(request, timeout=20) as response:
                          payload = response.read()
                      if len(payload) != expected_bytes or hashlib.sha256(payload).hexdigest() != expected_sha:
                          raise AssertionError("public pointer bytes differ")
                      payloads.append(payload)
                      verified.append({"path": relative, "url": url, "bytes": len(payload), "sha256": expected_sha})
                      break
                  except Exception as error:
                      last_error = error
                      if attempt < 10:
                          time.sleep(2)
              else:
                  raise AssertionError(f"public pointer did not converge: {relative}: {last_error}")
          if payloads[0] != payloads[1]:
              raise AssertionError("public live pointer copies differ")
          pointer = json.loads(payloads[0])
          if pointer.get("schema") != "pipelinenews.live-pointer.v3" or pointer.get("classification") != "VERIFIED_LIVE_TIMESTAMPED_RELEASE":
              raise AssertionError("public live pointer contract changed")
          manifest_binding = pointer.get("release_manifest", {})
          manifest_url = f"{page_root}/{manifest_binding.get('path')}?deployment={deployed_sha}"
          with urlopen(Request(manifest_url, headers={"Cache-Control": "no-cache", "User-Agent": "PipelineNews-Pages-Gate/1"}), timeout=20) as response:
              manifest_raw = response.read()
          if len(manifest_raw) != manifest_binding.get("bytes") or hashlib.sha256(manifest_raw).hexdigest() != manifest_binding.get("sha256"):
              raise AssertionError("public live pointer release-manifest binding failed")
          report = {
              "schema": "pipelinenews.public-live-pointer-readback.v1",
              "deployed_sha": deployed_sha,
              "pointer_sha256": expected_sha,
              "byte_identical": True,
              "release_manifest_bound": True,
              "verified": verified,
              "status": "PASS",
          }
          Path("reports/public-live-pointer-readback.json").write_text(json.dumps(report, indent=2) + "\n", encoding="utf-8")
          print(json.dumps({"status": "PASS", "pointer_sha256": expected_sha}))
          PY

      - name: Browser-proof deployed authorised fast candidate
        if: ${{ needs.build.outputs.candidate_path != '' }}
        shell: bash
        env:
          FAST_SITE_URL: ${{ needs.deploy.outputs.page_url }}${{ needs.build.outputs.candidate_path }}?deployment=${{ needs.build.outputs.deployed_sha }}
          FAST_SITE_VERIFIER: ${{ needs.build.outputs.candidate_verifier }}
          FAST_SITE_EVIDENCE: reports/browser-${{ needs.build.outputs.candidate_generation }}-fast-live.json
        run: |
          set -euo pipefail
          test -n "$FAST_SITE_VERIFIER"
          test -f "$FAST_SITE_VERIFIER"
          mkdir -p reports
          node "$FAST_SITE_VERIFIER" | tee "$FAST_SITE_EVIDENCE"

      - name: Browser-proof deployed Atlas V9 timestamp-folder release against real receiver
        if: ${{ needs.build.outputs.timestamp_folder_path != '' }}
        shell: bash
        env:
          TIMESTAMP_FOLDER_URL: ${{ needs.deploy.outputs.page_url }}${{ needs.build.outputs.timestamp_folder_path }}
          TIMESTAMP_FOLDER_PROOF: reports/browser-${{ needs.build.outputs.timestamp_folder_release }}-atlas-v9-live.json
          PLAYWRIGHT_VERSION: "1.55.0"
        run: |
          set -euo pipefail
          mkdir -p reports
          node atman/202608291310-public-browser-readback.mjs \
            --candidate "$TIMESTAMP_FOLDER_URL" \
            --output "$TIMESTAMP_FOLDER_PROOF"

      - name: Browser-proof deployed modular release
        env:
          PIPELINENEWS_GENERATION: ${{ needs.build.outputs.generation }}
          PIPELINENEWS_PAGE_URL: ${{ needs.deploy.outputs.page_url }}${{ needs.build.outputs.release_path }}
          PIPELINENEWS_DEPLOY_SHA: ${{ needs.build.outputs.deployed_sha }}
          PIPELINENEWS_EVIDENCE_DIR: reports/browser-${{ needs.build.outputs.generation }}-live
        run: node atman/202608262014-browser-proof.mjs

      - name: Upload deployed browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipelinenews-${{ needs.build.outputs.generation }}-live-${{ needs.build.outputs.deployed_sha }}
          path: |
            reports/browser-*-live
            reports/browser-*-fast-live.json
            reports/browser-*-atlas-v9-live.json
            reports/fast-live-closure-*.json
            reports/timestamp-folder-live-closure-*.json
            reports/public-live-pointer-readback.json
          if-no-files-found: warn
          retention-days: 30

      - name: Start proof-bound pointer staging after first public folder proof
        if: ${{ success() && needs.build.outputs.timestamp_folder_path != '' && needs.build.outputs.live_pointer != 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOYED_SHA: ${{ needs.build.outputs.deployed_sha }}
        run: |
          set -euo pipefail
          payload="$(python3 - <<'PY'
          import json
          import os
          print(json.dumps({
              "ref": "main",
              "inputs": {
                  "mode": "stage-pointer",
                  "pages_run_id": os.environ["GITHUB_RUN_ID"],
                  "deployed_commit": os.environ["DEPLOYED_SHA"],
              },
          }))
          PY
          )"
          status="$(curl --silent --show-error --output "$RUNNER_TEMP/pointer-dispatch-response" --write-out '%{http_code}' \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/202608291310-atlas-v9-deep-link-successor.yml/dispatches" \
            --data "$payload")"
          test "$status" = 204
