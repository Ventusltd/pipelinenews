name: Build PipelineNews V8 Fast Site

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-v8-fast-site.yml"
      - "index/202608270055-compile-v8-fast.mjs"
      - "build/javascript/202608270055-verify-v8-fast-contract.mjs"
      - "build/javascript/202608270055-verify-v8-fast-browser.mjs"
      - "ui/javascript/202608270055-v8-fast-runtime.js"
      - "ui/styles/202608270055-v8-fast-overrides.css"

permissions:
  contents: write

concurrency:
  group: build-pipelinenews-v8-fast-site
  cancel-in-progress: false

env:
  FAST_GENERATION: "202608270055"
  FAST_WORK_ROOT: work/v8-fast-site

jobs:
  build-gate-record:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Configure Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Record immutable source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_REF" = "refs/heads/main"
          mkdir -p "$FAST_WORK_ROOT/evidence"
          git rev-parse HEAD > "$FAST_WORK_ROOT/evidence/source-sha.txt"
          git show -s --format='%H%n%T%n%ct' HEAD > "$FAST_WORK_ROOT/evidence/source-record.txt"

      - name: Reject an existing immutable generation
        shell: bash
        run: |
          set -euo pipefail
          existing=()
          for candidate in \
            "build/${FAST_GENERATION}-v8-fast-site-manifest.json" \
            "releases/${FAST_GENERATION}-v8-fast-candidate.html" \
            "releases/javascript/${FAST_GENERATION}-v8-fast-runtime.js" \
            "releases/styles/${FAST_GENERATION}-v8-fast.css" \
            "releases/data/${FAST_GENERATION}-v8-fast-registry.json"; do
            if [[ -e "$candidate" || -L "$candidate" ]]; then
              existing+=("$candidate")
            fi
          done
          if [[ -d releases/data ]]; then
            while IFS= read -r candidate; do
              existing+=("$candidate")
            done < <(
              find releases/data -maxdepth 1 \( -type f -o -type l \) \
                -name "${FAST_GENERATION}-????????????-v8-fast-*.json" -print | LC_ALL=C sort
            )
          fi
          if (( ${#existing[@]} != 0 )); then
            printf 'Immutable generation %s already exists:\n' "$FAST_GENERATION" >&2
            printf '  %s\n' "${existing[@]}" >&2
            exit 1
          fi

      - name: Check compiler and verifier syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check "index/${FAST_GENERATION}-compile-v8-fast.mjs"
          node --check "ui/javascript/${FAST_GENERATION}-v8-fast-runtime.js"
          node --check "build/javascript/${FAST_GENERATION}-verify-v8-fast-contract.mjs"
          node --check "build/javascript/${FAST_GENERATION}-verify-v8-fast-browser.mjs"
          ! grep -q 'SHA256_PENDING' "index/${FAST_GENERATION}-compile-v8-fast.mjs"

      - name: Compile twice from the exact source
        shell: bash
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p "$FAST_WORK_ROOT/pass-a" "$FAST_WORK_ROOT/pass-b"
          node "index/${FAST_GENERATION}-compile-v8-fast.mjs" \
            --out-root "$FAST_WORK_ROOT/pass-a" \
            | tee "$FAST_WORK_ROOT/evidence/compiler-pass-a.json"
          node "index/${FAST_GENERATION}-compile-v8-fast.mjs" \
            --out-root "$FAST_WORK_ROOT/pass-b" \
            | tee "$FAST_WORK_ROOT/evidence/compiler-pass-b.json"

      - name: Prove byte-for-byte reproducibility
        shell: bash
        run: |
          set -euo pipefail
          (
            cd "$FAST_WORK_ROOT/pass-a"
            find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum
          ) > "$FAST_WORK_ROOT/evidence/pass-a-sha256.txt"
          (
            cd "$FAST_WORK_ROOT/pass-b"
            find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum
          ) > "$FAST_WORK_ROOT/evidence/pass-b-sha256.txt"
          diff --recursive --brief "$FAST_WORK_ROOT/pass-a" "$FAST_WORK_ROOT/pass-b"
          diff --unified \
            "$FAST_WORK_ROOT/evidence/pass-a-sha256.txt" \
            "$FAST_WORK_ROOT/evidence/pass-b-sha256.txt"

      - name: Materialize the verified candidate closure
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { constants } from "node:fs";
          import { copyFile, mkdir, readFile, readdir, writeFile } from "node:fs/promises";
          import path from "node:path";

          const generation = process.env.FAST_GENERATION;
          const workRoot = path.resolve(process.env.FAST_WORK_ROOT);
          const passRoot = path.join(workRoot, "pass-a");
          const manifestPath = `build/${generation}-v8-fast-site-manifest.json`;
          const manifest = JSON.parse(await readFile(path.join(passRoot, manifestPath), "utf8"));
          assert.equal(manifest.generation, generation);
          assert.equal(manifest.source_commit, process.env.GITHUB_SHA);
          assert.equal(String(manifest.github_run_id), process.env.GITHUB_RUN_ID);
          const expected = [manifestPath, ...manifest.outputs.map(({ path: outputPath }) => outputPath)].sort();
          assert.equal(new Set(expected).size, expected.length, "candidate closure contains duplicate paths");

          async function walk(directory, prefix = "") {
            const result = [];
            for (const entry of await readdir(directory, { withFileTypes: true })) {
              const relative = path.posix.join(prefix, entry.name);
              if (entry.isDirectory()) result.push(...await walk(path.join(directory, entry.name), relative));
              else if (entry.isFile()) result.push(relative);
              else assert.fail(`unexpected compiler output type: ${relative}`);
            }
            return result;
          }

          assert.deepEqual((await walk(passRoot)).sort(), expected, "compiler output differs from declared closure");
          for (const relative of expected) {
            const target = path.resolve(relative);
            assert.ok(target.startsWith(`${process.cwd()}${path.sep}`), `target escapes repository: ${relative}`);
            await mkdir(path.dirname(target), { recursive: true });
            await copyFile(path.join(passRoot, relative), target, constants.COPYFILE_EXCL);
          }
          await writeFile(
            path.join(workRoot, "evidence", "materialized-closure.json"),
            `${JSON.stringify({ generation, source_commit: process.env.GITHUB_SHA, files: expected }, null, 2)}\n`,
          );
          NODE

      - name: Verify the compiled data and cache contract
        shell: bash
        run: |
          set -euo pipefail
          node "build/javascript/${FAST_GENERATION}-verify-v8-fast-contract.mjs" \
            --root . \
            --generation "$FAST_GENERATION" \
            --source-manifest "build/${FAST_GENERATION}-v8-fast-site-manifest.json" \
            | tee "$FAST_WORK_ROOT/evidence/contract-proof.json"

      - name: Prove the candidate is barred from Pages staging
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee "$FAST_WORK_ROOT/evidence/pages-boundary-proof.json"
          import importlib.util
          import json
          import os
          from pathlib import Path

          root = Path.cwd().resolve()
          module_path = root / "atman/202608262014-build-pages.py"
          spec = importlib.util.spec_from_file_location("pipelinenews_pages_gate", module_path)
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          generation, _, release_manifest = module.select_release(root, "latest")
          release = {
              "release_path": f"releases/{generation}-index.html",
              "manifest": release_manifest,
          }
          excluded = module.non_deploying_candidate_outputs(root, release)
          candidate = json.loads((root / f"build/{os.environ['FAST_GENERATION']}-v8-fast-site-manifest.json").read_text())
          expected = {record["path"] for record in candidate["outputs"]}
          module.require(excluded == expected, "Pages exclusion set differs from the fast candidate closure")
          print(json.dumps({
              "schema": "pipelinenews.v8.fast-pages-boundary-proof.v1",
              "generation": candidate["generation"],
              "deployment": candidate["deployment"],
              "excluded_outputs": sorted(excluded),
              "pages_artifact_created": False,
          }, indent=2))
          PY

      - name: Install pinned browser verifier
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Browser-proof the fast candidate
        shell: bash
        env:
          FAST_SITE_URL: http://127.0.0.1:4173/releases/202608270055-v8-fast-candidate.html
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 --directory . > "$RUNNER_TEMP/v8-fast-http.log" 2>&1 &
          server_pid="$!"
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent --show-error "$FAST_SITE_URL" >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent --show-error "$FAST_SITE_URL" >/dev/null
          node "build/javascript/${FAST_GENERATION}-verify-v8-fast-browser.mjs" \
            | tee "$FAST_WORK_ROOT/evidence/browser-proof.json"

      - name: Stage and verify the exact declared closure
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { createHash } from "node:crypto";
          import { readFile, writeFile } from "node:fs/promises";
          import { spawnSync } from "node:child_process";
          import path from "node:path";

          const generation = process.env.FAST_GENERATION;
          const manifestPath = `build/${generation}-v8-fast-site-manifest.json`;
          const manifestBytes = await readFile(manifestPath);
          const manifest = JSON.parse(manifestBytes);
          assert.equal(manifest.generation, generation);
          assert.equal(manifest.source_commit, process.env.GITHUB_SHA);
          const declared = manifest.outputs.map(({ path: outputPath }) => outputPath);
          const expected = [manifestPath, ...declared].sort();
          assert.equal(new Set(expected).size, expected.length, "candidate closure contains duplicate paths");
          assert.ok(declared.every((outputPath) => outputPath.startsWith("releases/")), "unexpected candidate output root");
          assert.ok(declared.every((outputPath) => !outputPath.startsWith("releases/manifests/")), "promotion manifest is outside this workflow");

          for (const record of manifest.outputs) {
            const bytes = await readFile(record.path);
            assert.equal(bytes.length, record.bytes, `byte count changed: ${record.path}`);
            assert.equal(createHash("sha256").update(bytes).digest("hex"), record.sha256, `hash changed: ${record.path}`);
          }

          const add = spawnSync("git", ["add", "--", ...expected], { encoding: "utf8" });
          assert.equal(add.status, 0, add.stderr || add.stdout);
          const diff = spawnSync("git", ["diff", "--cached", "--name-only", "-z"], { encoding: "buffer" });
          assert.equal(diff.status, 0, diff.stderr.toString());
          const staged = diff.stdout.toString("utf8").split("\0").filter(Boolean).sort();
          assert.deepEqual(staged, expected, "staged paths differ from the declared candidate closure");
          const status = spawnSync("git", ["diff", "--cached", "--name-status"], { encoding: "utf8" });
          assert.equal(status.status, 0, status.stderr);
          assert.ok(status.stdout.trim().split("\n").every((line) => line.startsWith("A\t")), "candidate would overwrite a tracked path");

          for (const relative of expected) {
            const stagedFile = spawnSync("git", ["show", `:${relative}`], { encoding: "buffer", maxBuffer: 32 * 1024 * 1024 });
            assert.equal(stagedFile.status, 0, stagedFile.stderr.toString());
            assert.ok(stagedFile.stdout.equals(await readFile(relative)), `staged bytes changed: ${relative}`);
          }
          await writeFile(
            path.join(process.env.FAST_WORK_ROOT, "evidence", "staged-closure.json"),
            `${JSON.stringify({ generation, source_commit: process.env.GITHUB_SHA, files: expected }, null, 2)}\n`,
          );
          NODE

      - name: Upload build and verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipelinenews-v8-fast-site-${{ env.FAST_GENERATION }}-${{ github.run_id }}
          path: ${{ env.FAST_WORK_ROOT }}/evidence
          if-no-files-found: error
          retention-days: 30

      - name: Commit only the green immutable candidate
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin refs/heads/main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "v8: build fast site candidate ${FAST_GENERATION}"
          git push origin HEAD:main
