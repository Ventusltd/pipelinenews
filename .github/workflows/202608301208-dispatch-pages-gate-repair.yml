name: 202608301208 Dispatch repaired Atlas-link Pages gate
run-name: Dispatch current Pages-gate proof from ${{ github.sha }}

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/202608301208-dispatch-pages-gate-repair.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Dispatch existing repaired Pages-gate workflow at current main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/202608301153-repair-pages-historical-source-attestation-v2.yml/dispatches" \
            -d '{"ref":"main"}'
