name: Build PipelineNews Federated Relationship Candidate 202608282044

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/202608282044-federated-relationship-candidate.yml"
      - "build/python/202608282044-build-relationship-status-parquet.py"
      - "index/202608282044-compile-v8-federated-relationships.mjs"
      - "manifests/202608282044-federated-relationship-candidate.json"
      - "ui/cartridges/202608282044-federated-relationships.mjs"

permissions:
  contents: read

concurrency:
  group: pipelinenews-main-candidate-build
  cancel-in-progress: false

env:
  GENERATION: "202608282044"
  SOURCE_PARENT: "a1516f23a2f8f1e2a3b286ed73cd580ce501c179"
  PARENT_OUTPUT_COMMIT: "58ca361c921264c1218d4a3f6d1f87da33f8473e"
  WORK_ROOT: "work/202608282044-federated-relationships"
  DUCKDB_VERSION: "1.3.2"

jobs:
  build:
    name: Verify two contracts and compile an abstention-only candidate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Configure Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: "22"

      - name: Configure Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: "3.12"

      - name: Prove exact five-file timestamped source boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "$SOURCE_PARENT"
          test "$(git rev-list --count "$SOURCE_PARENT..$GITHUB_SHA")" = "1"
          mkdir -p "$WORK_ROOT/evidence"
          git diff --name-only "$SOURCE_PARENT" "$GITHUB_SHA" | LC_ALL=C sort > "$WORK_ROOT/evidence/source-paths.txt"
          diff -u <(printf '%s\n' \
            ".github/workflows/$GENERATION-federated-relationship-candidate.yml" \
            "build/python/$GENERATION-build-relationship-status-parquet.py" \
            "index/$GENERATION-compile-v8-federated-relationships.mjs" \
            "manifests/$GENERATION-federated-relationship-candidate.json" \
            "ui/cartridges/$GENERATION-federated-relationships.mjs" | LC_ALL=C sort) \
            "$WORK_ROOT/evidence/source-paths.txt"
          test -z "$(git diff --name-only "$SOURCE_PARENT" "$GITHUB_SHA" | grep -E '^(releases/|build/202608282044-v8-fast-site-manifest.json|atman/|releases/current.json$)' || true)"
          git diff --quiet "$PARENT_OUTPUT_COMMIT" "$GITHUB_SHA" -- \
            build/202608272130-v8-fast-site-manifest.json \
            releases/202608272130-v8-fast-candidate.html \
            releases/javascript/202608272130-v8-fast-runtime.js \
            releases/data/202608272130-v8-fast-registry.json \
            releases/current.json \
            .github/workflows/pages.yml
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { readFile } from "node:fs/promises";
          const workflow = await readFile(`.github/workflows/${process.env.GENERATION}-federated-relationship-candidate.yml`, "utf8");
          const upload = ["actions", "upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02"].join("/");
          assert.equal(workflow.split(upload).length - 1, 2);
          for (const forbidden of [
            ["actions", "deploy-pages"].join("/"),
            ["actions", "upload-pages-artifact"].join("/"),
            ["pages", "write"].join(": "),
            ["id-token", "write"].join(": "),
            ["git", "push"].join(" "),
            ["update", "ref"].join("-"),
          ]) assert.ok(!workflow.includes(forbidden), `deployment capability entered workflow: ${forbidden}`);
          NODE

      - name: Verify source manifest and immutable pins
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { createHash } from "node:crypto";
          import { lstat, readFile } from "node:fs/promises";
          const generation = process.env.GENERATION;
          const path = `manifests/${generation}-federated-relationship-candidate.json`;
          const manifest = JSON.parse(await readFile(path));
          assert.equal(manifest.schema, "pipelinenews.federated-relationship-source-manifest.v1");
          assert.equal(manifest.generation, generation);
          assert.equal(manifest.source_parent_commit, process.env.SOURCE_PARENT);
          assert.equal(manifest.parent_output_commit, process.env.PARENT_OUTPUT_COMMIT);
          assert.equal(manifest.deployment, "not-authorised");
          assert.equal(manifest.source_boundary.length, 5);
          assert.equal(manifest.source_files.length, 4);
          assert.deepEqual(manifest.source_boundary.slice().sort(), [
            `.github/workflows/${generation}-federated-relationship-candidate.yml`,
            `build/python/${generation}-build-relationship-status-parquet.py`,
            `index/${generation}-compile-v8-federated-relationships.mjs`,
            path,
            `ui/cartridges/${generation}-federated-relationships.mjs`,
          ].sort());
          for (const pin of [...manifest.source_files, ...manifest.pinned_inputs]) {
            assert.deepEqual(Object.keys(pin).sort(), ["bytes", "path", "sha256"]);
            const stat = await lstat(pin.path);
            assert.ok(stat.isFile() && !stat.isSymbolicLink(), `not a regular pinned file: ${pin.path}`);
            const raw = await readFile(pin.path);
            assert.equal(raw.length, pin.bytes, `byte drift: ${pin.path}`);
            assert.equal(createHash("sha256").update(raw).digest("hex"), pin.sha256, `digest drift: ${pin.path}`);
          }
          assert.equal(manifest.data_law.duckdb_version, "1.3.2");
          assert.equal(manifest.data_law.compression, "ZSTD");
          assert.equal(manifest.data_law.rows, 3);
          assert.equal(manifest.identity_and_privacy.all_decisions, "ABSTAIN");
          assert.equal(manifest.identity_and_privacy.project_bindings, 0);
          assert.equal(manifest.publication.candidate_only, true);
          assert.equal(manifest.publication.current_pointer_may_change, false);
          assert.equal(manifest.publication.pages_may_change, false);
          assert.equal(manifest.publication.globalgrid_catalogue_may_change, false);
          NODE
          node --check "index/$GENERATION-compile-v8-federated-relationships.mjs"
          node --check "ui/cartridges/$GENERATION-federated-relationships.mjs"
          PYTHONDONTWRITEBYTECODE=1 python -c 'from pathlib import Path; p=Path("build/python/202608282044-build-relationship-status-parquet.py"); compile(p.read_text(), str(p), "exec")'
          test ! -d build/python/__pycache__

      - name: Install pinned analytical engine
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check "duckdb==$DUCKDB_VERSION"
          PYTHONDONTWRITEBYTECODE=1 python - <<'PY'
          import duckdb
          assert duckdb.__version__ == "1.3.2"
          PY

      - name: Fetch exactly two pinned compact contracts
        shell: bash
        run: |
          set -euo pipefail
          incoming="$WORK_ROOT/incoming"
          mkdir -p "$incoming"
          fetch_contract() {
            local url="$1" target="$2" bytes="$3" digest="$4"
            curl --proto '=https' --tlsv1.2 --fail --silent --show-error \
              --max-time 10 --max-filesize 16384 --output "$target" "$url"
            test "$(wc -c < "$target")" = "$bytes"
            test "$(sha256sum "$target" | cut -d' ' -f1)" = "$digest"
          }
          fetch_contract \
            "https://raw.githubusercontent.com/Ventusltd/companies/148335a6eb1fdf8c488fc1608ef29b6add0da269/contracts/202608281846-federated-company-repd-relationship-contract-v1.json" \
            "$incoming/companies.json" 7896 43905c977b990ff5f1bbe4a8fc8eafee94cd5e474730adcd6b7112e166fcc358
          fetch_contract \
            "https://raw.githubusercontent.com/Ventusltd/data-centres-gb/c5dfdee3ba5dbe94c1e29ec8cfa9d47431da9506/contracts/202608281944-data-centre-company-federation-v1.json" \
            "$incoming/data-centres.json" 7024 894234caa44a898b17f2bebcf10e24538ecd39854c09368c57dd8948c1c720a1
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { readFile, writeFile } from "node:fs/promises";
          const root = process.env.WORK_ROOT;
          const companies = JSON.parse(await readFile(`${root}/incoming/companies.json`));
          const centres = JSON.parse(await readFile(`${root}/incoming/data-centres.json`));
          assert.equal(companies.publication.promotion_eligible, false);
          assert.equal(companies.relationship_policy.default_consumer_decision, "ABSTAIN");
          assert.equal(centres.publication.promotion_eligible, false);
          assert.equal(centres.interpretation.default_decision, "ABSTAIN");
          await writeFile(`${root}/evidence/network-boundary.json`, `${JSON.stringify({
            schema: "pipelinenews.federated-relationship-network-boundary.v1",
            generation: process.env.GENERATION,
            requests: 2,
            parallel_requests: 0,
            redirects: 0,
            maximum_contract_bytes: 16384,
            raw_companies_house_archives: 0,
            raw_overpass_responses: 0,
            datacentermap_requests: 0,
            hash_and_byte_verification_before_decode: true,
            status: "PASS",
          }, null, 2)}\n`);
          NODE

      - name: Build two deterministic ZSTD projections
        shell: bash
        run: |
          set -euo pipefail
          for pass in a b; do
            PYTHONDONTWRITEBYTECODE=1 python "build/python/$GENERATION-build-relationship-status-parquet.py" \
              --contract data/federation/202608282041-relationship-intelligence-contract.json \
              --companies "$WORK_ROOT/incoming/companies.json" \
              --data-centres "$WORK_ROOT/incoming/data-centres.json" \
              --out-root "$WORK_ROOT/pass-$pass" \
              --audit "$WORK_ROOT/pass-$pass/releases/data/intelligence/$GENERATION/$GENERATION-relationship-governance-audit.json" \
              | tee "$WORK_ROOT/evidence/builder-$pass.json"
          done
          diff -qr "$WORK_ROOT/pass-a" "$WORK_ROOT/pass-b"
          test ! -d build/python/__pycache__

      - name: Independently read back landed Parquet twice
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python - <<'PY'
          import duckdb
          import os
          from pathlib import Path
          generation = os.environ["GENERATION"]
          root = Path(os.environ["WORK_ROOT"])
          expected = [
              ("COMPANY_REPD", "ALL_CANDIDATES", 482030, "UNKNOWN", "ABSTAIN", False),
              ("COMPANY_REPD", "SOLAR_SUBSET", 346233, "UNKNOWN", "ABSTAIN", False),
              ("DATA_CENTRE_COMPANY", "OWNER_OPERATOR_SLOTS", 612, "UNASSERTED_OWNER_OR_OPERATOR_SLOT", "ABSTAIN", False),
          ]
          for pass_name in ("a", "b"):
              path = root / f"pass-{pass_name}/releases/data/intelligence/{generation}/relationship-governance-status/{generation}-part-000.parquet"
              con = duckdb.connect()
              rows = con.execute("SELECT relationship_family, segment, candidate_rows, requested_role, decision, eligible_for_join FROM read_parquet(?, hive_partitioning=false) ORDER BY 1, 2", [str(path)]).fetchall()
              assert rows == expected
              gates = con.execute("SELECT count(*), count(DISTINCT (relationship_family, segment)), count(*) FILTER (WHERE eligible_for_join OR decision <> 'ABSTAIN') FROM read_parquet(?, hive_partitioning=false)", [str(path)]).fetchone()
              assert gates == (3, 3, 0)
              assert con.execute("SELECT DISTINCT compression FROM parquet_metadata(?)", [str(path)]).fetchall() == [("ZSTD",)]
              con.close()
          PY

      - name: Compile two independent immutable candidates
        shell: bash
        run: |
          set -euo pipefail
          for pass in a b; do
            SOURCE_COMMIT="$GITHUB_SHA" GITHUB_RUN_ID="$GITHUB_RUN_ID" node \
              "index/$GENERATION-compile-v8-federated-relationships.mjs" \
              --out-root "$WORK_ROOT/pass-$pass" \
              --audit "$WORK_ROOT/pass-$pass/releases/data/intelligence/$GENERATION/$GENERATION-relationship-governance-audit.json" \
              | tee "$WORK_ROOT/evidence/compiler-$pass.json"
          done
          diff -qr "$WORK_ROOT/pass-a" "$WORK_ROOT/pass-b"

      - name: Verify complete candidate closure and unchanged product laws
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { createHash } from "node:crypto";
          import { lstat, readFile, readdir } from "node:fs/promises";
          import path from "node:path";
          const generation = process.env.GENERATION;
          const root = path.resolve(process.env.WORK_ROOT, "pass-a");
          const manifestPath = `build/${generation}-v8-fast-site-manifest.json`;
          const manifest = JSON.parse(await readFile(path.join(root, manifestPath)));
          const sha256 = (raw) => createHash("sha256").update(raw).digest("hex");
          async function walk(directory, base = directory) {
            const result = [];
            for (const item of await readdir(directory, { withFileTypes: true })) {
              const filename = path.join(directory, item.name);
              if (item.isDirectory()) result.push(...await walk(filename, base));
              else if (item.isFile()) result.push(path.relative(base, filename).split(path.sep).join("/"));
              else throw new Error(`non-file candidate entry: ${filename}`);
            }
            return result.sort();
          }
          assert.equal(manifest.schema, "pipelinenews.v8.fast-site-candidate.v1");
          assert.equal(manifest.generation, generation);
          assert.equal(manifest.source_commit, process.env.GITHUB_SHA);
          assert.equal(manifest.source_parent_commit, process.env.SOURCE_PARENT);
          assert.equal(manifest.parent_output_commit, process.env.PARENT_OUTPUT_COMMIT);
          assert.equal(manifest.github_run_id, process.env.GITHUB_RUN_ID);
          assert.equal(manifest.deployment, "not-authorised");
          assert.equal(manifest.parity.project_count, 7680);
          assert.equal(manifest.parity.capacity_mw, 356474.09);
          assert.equal(manifest.parity.headlines, 136);
          assert.equal(manifest.canonical_product.rows_per_page, 100);
          assert.equal(manifest.canonical_product.table_columns, 11);
          assert.equal(manifest.relationship_governance_status.rows, 3);
          assert.equal(manifest.relationship_governance_status.project_bindings, 0);
          assert.equal(manifest.state.candidate, "ARTIFACT_ONLY");
          assert.equal(manifest.state.current_pointer_changed, false);
          assert.equal(manifest.state.pages_changed, false);
          assert.equal(manifest.state.globalgrid_catalogue_changed, false);
          assert.equal(manifest.outputs.length, 7);
          const expected = [manifestPath, ...manifest.outputs.map(({ path: relative }) => relative)].sort();
          assert.equal(manifest.closure.files, expected.length);
          assert.deepEqual(await walk(root), expected);
          for (const item of manifest.outputs) {
            const filename = path.join(root, item.path);
            const stat = await lstat(filename);
            assert.ok(stat.isFile() && !stat.isSymbolicLink());
            const raw = await readFile(filename);
            assert.equal(raw.length, item.bytes, `output byte drift: ${item.path}`);
            assert.equal(sha256(raw), item.sha256, `output digest drift: ${item.path}`);
          }
          for (const item of manifest.inputs) {
            const raw = await readFile(item.path);
            assert.equal(raw.length, item.bytes, `input byte drift: ${item.path}`);
            assert.equal(sha256(raw), item.sha256, `input digest drift: ${item.path}`);
          }
          const html = await readFile(path.join(root, `releases/${generation}-v8-fast-candidate.html`), "utf8");
          const runtime = await readFile(path.join(root, `releases/javascript/${generation}-v8-fast-runtime.js`), "utf8");
          assert.ok(html.includes("RELATIONSHIP EVIDENCE — CANDIDATES AND ABSTENTIONS"));
          assert.ok(html.includes(`javascript/${generation}-v8-fast-runtime.js`));
          assert.ok(runtime.includes("bindFederatedRelationships();"));
          assert.ok(runtime.includes("zero project bindings"));
          assert.ok(!runtime.includes("confirmed owner"));
          NODE
          git diff --quiet
          test -z "$(git status --short --untracked-files=no)"

      - name: Upload immutable quarantine candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pipelinenews-federated-relationship-candidate-${{ github.run_id }}
          path: work/202608282044-federated-relationships/pass-a/
          if-no-files-found: error
          retention-days: 30
          overwrite: true

      - name: Upload compact build evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pipelinenews-federated-relationship-evidence-${{ github.run_id }}
          path: work/202608282044-federated-relationships/evidence/
          if-no-files-found: error
          retention-days: 30
          overwrite: true
