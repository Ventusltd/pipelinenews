name: Pipeline coverage contract
on:
  push:
    branches: [main, 'codex/20260906-next30']
    paths: ['cartridges/**', 'discovery/bbc_rss.py', 'discovery/test_bbc_rss.py', 'tools/publication/*candidate.mjs', 'tools/publication/verify-testcode.mjs', 'ui/templates/bbc-rss-intelligence.html', '.github/workflows/coverage-contract.yml', '.github/workflows/bbc-rss-discovery.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  coverage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test cartridges/*.test.mjs
      - run: python3 -B -m unittest discover -s discovery -p test_bbc_rss.py
      - name: Verify candidate files against committed source, independent of checkout newlines
        run: |
          node tools/publication/build-coverage-candidate.mjs 200001010001
          node tools/publication/verify-testcode.mjs testcode/200001010001
          node tools/publication/build-rss-candidate.mjs 200001010002
          node tools/publication/verify-testcode.mjs testcode/200001010002
