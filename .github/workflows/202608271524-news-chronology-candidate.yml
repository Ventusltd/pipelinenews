name: Build PipelineNews News Chronology Candidate 202608271524

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/202608271524-news-chronology-candidate.yml"
      - "index/202608271524-compile-v8-news-chronology.mjs"
      - "build/javascript/202608271524-verify-v8-news-chronology-contract.mjs"
      - "build/javascript/202608271524-verify-v8-news-chronology-browser.mjs"
      - "manifests/202608271524-news-chronology-candidate.json"

permissions:
  contents: read

concurrency:
  group: pipelinenews-news-chronology-202608271524
  cancel-in-progress: false

env:
  NEWS_GENERATION: "202608271524"
  NEWS_PARENT_GENERATION: "202608271329"
  NEWS_SOURCE_GENERATION: "202608270844"
  NEWS_ROLLBACK_GENERATION: "202608270055"
  NEWS_SOURCE_PARENT: "b6a2b441799307ca55751d770a6083d05cdf15b5"
  NEWS_WORK_ROOT: "work/202608271524-news-chronology"

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Configure Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Prove exact progressive source boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "$NEWS_SOURCE_PARENT"
          mkdir -p "$NEWS_WORK_ROOT/evidence"
          git show -s --format='%H%n%P%n%T%n%ct' HEAD > "$NEWS_WORK_ROOT/evidence/source-record.txt"
          git diff --name-only "$NEWS_SOURCE_PARENT" HEAD | LC_ALL=C sort > "$NEWS_WORK_ROOT/evidence/source-paths.txt"
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { readFile, writeFile } from "node:fs/promises";
          const generation = process.env.NEWS_GENERATION;
          const actual = (await readFile(`${process.env.NEWS_WORK_ROOT}/evidence/source-paths.txt`, "utf8"))
            .trim().split("\n").filter(Boolean);
          const expected = [
            `.github/workflows/${generation}-news-chronology-candidate.yml`,
            `build/javascript/${generation}-verify-v8-news-chronology-browser.mjs`,
            `build/javascript/${generation}-verify-v8-news-chronology-contract.mjs`,
            `index/${generation}-compile-v8-news-chronology.mjs`,
            `manifests/${generation}-news-chronology-candidate.json`,
          ].sort();
          assert.deepEqual(actual, expected, "source commit must contain exactly the five declared timestamped files");
          assert.ok(actual.every((relative) => relative.includes(generation)));
          assert.ok(actual.every((relative) => !relative.startsWith("releases/") && !relative.startsWith("data/")));
          await writeFile(`${process.env.NEWS_WORK_ROOT}/evidence/source-scope-proof.json`, `${JSON.stringify({
            schema: "pipelinenews.news-chronology-source-scope-proof.v1",
            generation,
            source_commit: process.env.GITHUB_SHA,
            source_parent_commit: process.env.NEWS_SOURCE_PARENT,
            changed_paths: actual,
            source_files: 5,
            prior_releases_changed: false,
            stable_route_changed: false,
            deployment_authorised: false,
          }, null, 2)}\n`);
          NODE
          git diff --quiet "$NEWS_SOURCE_PARENT" HEAD -- \
            .github/workflows/pages.yml \
            .github/workflows/authorise-v8-fast-pages.yml \
            archive/202608261547-pipelinenews/releases/current.json \
            atman/202608262014-build-pages.py \
            build/202608270055-v8-fast-site-manifest.json \
            build/202608270844-v8-fast-site-manifest.json \
            build/202608271329-v8-fast-site-manifest.json \
            releases/202608270055-v8-fast-candidate.html \
            releases/202608270844-v8-fast-candidate.html \
            releases/202608271329-v8-fast-candidate.html

      - name: Verify timestamped source manifest and pinned references
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { createHash } from "node:crypto";
          import { lstat, readFile } from "node:fs/promises";
          const generation = process.env.NEWS_GENERATION;
          const manifestPath = `manifests/${generation}-news-chronology-candidate.json`;
          const manifest = JSON.parse(await readFile(manifestPath));
          assert.equal(manifest.schema, "pipelinenews.news-chronology-source-manifest.v1");
          assert.equal(manifest.generation, generation);
          assert.equal(manifest.source_parent_commit, process.env.NEWS_SOURCE_PARENT);
          assert.equal(manifest.parent_generation, process.env.NEWS_PARENT_GENERATION);
          assert.equal(manifest.news_source_generation, process.env.NEWS_SOURCE_GENERATION);
          assert.equal(manifest.rollback_generation, process.env.NEWS_ROLLBACK_GENERATION);
          assert.equal(manifest.scope, "one-issue-compile-time-news-chronology");
          assert.equal(manifest.deployment, "not-authorised");
          const expectedSourcePaths = [
            `.github/workflows/${generation}-news-chronology-candidate.yml`,
            `build/javascript/${generation}-verify-v8-news-chronology-browser.mjs`,
            `build/javascript/${generation}-verify-v8-news-chronology-contract.mjs`,
            `index/${generation}-compile-v8-news-chronology.mjs`,
          ].sort();
          assert.deepEqual(manifest.source_files.map((record) => record.path), expectedSourcePaths);
          for (const record of [...manifest.source_files, ...manifest.pinned_references]) {
            assert.deepEqual(Object.keys(record).sort(), ["bytes", "path", "sha256"]);
            assert.match(record.sha256, /^[a-f0-9]{64}$/u);
            const metadata = await lstat(record.path);
            assert.ok(metadata.isFile() && !metadata.isSymbolicLink(), `not a regular file: ${record.path}`);
            const bytes = await readFile(record.path);
            assert.equal(bytes.length, record.bytes, `byte count changed: ${record.path}`);
            assert.equal(createHash("sha256").update(bytes).digest("hex"), record.sha256, `hash changed: ${record.path}`);
          }
          assert.deepEqual(manifest.successor_counts, {
            projects: 7680,
            capacity_mw: 356474.09,
            headlines: 136,
            canonical_uk_headlines: 47,
            international_headlines: 19,
          });
          assert.deepEqual(manifest.first_window_bbc_article_ids, [
            "GG2050-NEWS-0E813A86D54E39FC",
            "GG2050-NEWS-B4B91FD3DA8F596C",
            "GG2050-NEWS-C3D0A5910F32E821",
          ]);
          assert.equal(manifest.atlas_deep_link_cartridge.generation, process.env.NEWS_PARENT_GENERATION);
          assert.equal(manifest.atlas_deep_link_cartridge.reused_byte_exact, true);
          assert.equal(manifest.protected_routes.stable_route_changed, false);
          assert.equal(manifest.protected_routes.current_pointer_changed, false);
          assert.equal(manifest.protected_routes.globalgrid_catalogue_changed, false);
          NODE

      - name: Reject an existing immutable generation
        shell: bash
        run: |
          set -euo pipefail
          test ! -e "build/$NEWS_GENERATION-v8-fast-site-manifest.json"
          test ! -e "releases/$NEWS_GENERATION-v8-fast-candidate.html"
          test ! -e "releases/javascript/$NEWS_GENERATION-v8-fast-runtime.js"
          test ! -e "releases/data/$NEWS_GENERATION-v8-fast-registry.json"
          test -z "$(find releases/data -maxdepth 1 -type f -name "$NEWS_GENERATION-*-v8-fast-news.json" -print -quit)"

      - name: Syntax-check all timestamped programs
        shell: bash
        run: |
          set -euo pipefail
          node --check "index/$NEWS_GENERATION-compile-v8-news-chronology.mjs"
          node --check "build/javascript/$NEWS_GENERATION-verify-v8-news-chronology-contract.mjs"
          node --check "build/javascript/$NEWS_GENERATION-verify-v8-news-chronology-browser.mjs"
          ! grep -R "SHA256_PENDING" \
            "index/$NEWS_GENERATION-compile-v8-news-chronology.mjs" \
            "build/javascript/$NEWS_GENERATION-verify-v8-news-chronology-contract.mjs" \
            "build/javascript/$NEWS_GENERATION-verify-v8-news-chronology-browser.mjs" \
            "manifests/$NEWS_GENERATION-news-chronology-candidate.json"

      - name: Compile two independent immutable candidates
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_COMMIT="$GITHUB_SHA" GITHUB_RUN_ID="$GITHUB_RUN_ID" node \
            "index/$NEWS_GENERATION-compile-v8-news-chronology.mjs" \
            --out-root "$NEWS_WORK_ROOT/pass-a" | tee "$NEWS_WORK_ROOT/evidence/compiler-pass-a.json"
          SOURCE_COMMIT="$GITHUB_SHA" GITHUB_RUN_ID="$GITHUB_RUN_ID" node \
            "index/$NEWS_GENERATION-compile-v8-news-chronology.mjs" \
            --out-root "$NEWS_WORK_ROOT/pass-b" | tee "$NEWS_WORK_ROOT/evidence/compiler-pass-b.json"

      - name: Prove deterministic bytes and materialise the quarantine candidate
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { createHash } from "node:crypto";
          import { constants } from "node:fs";
          import { copyFile, mkdir, readFile, readdir, writeFile } from "node:fs/promises";
          import path from "node:path";
          const root = process.cwd();
          const work = process.env.NEWS_WORK_ROOT;
          const generation = process.env.NEWS_GENERATION;
          const passA = path.resolve(work, "pass-a");
          const passB = path.resolve(work, "pass-b");
          const manifestRelative = `build/${generation}-v8-fast-site-manifest.json`;
          const manifest = JSON.parse(await readFile(path.join(passA, manifestRelative)));
          assert.equal(manifest.source_commit, process.env.GITHUB_SHA);
          assert.equal(manifest.source_parent_commit, process.env.NEWS_SOURCE_PARENT);
          assert.equal(String(manifest.github_run_id), process.env.GITHUB_RUN_ID);
          assert.equal(manifest.deployment, "not-authorised");
          assert.equal(manifest.outputs.length, 4);
          const expected = [manifestRelative, ...manifest.outputs.map((record) => record.path)].sort();
          assert.equal(expected.length, 5);
          async function walk(directory, base = directory) {
            const files = [];
            for (const entry of await readdir(directory, { withFileTypes: true })) {
              const filename = path.join(directory, entry.name);
              if (entry.isDirectory()) files.push(...await walk(filename, base));
              else files.push(path.relative(base, filename).split(path.sep).join("/"));
            }
            return files.sort();
          }
          assert.deepEqual(await walk(passA), expected, "pass A contains undeclared output");
          assert.deepEqual(await walk(passB), expected, "pass B contains undeclared output");
          const records = new Map(manifest.outputs.map((record) => [record.path, record]));
          const hashes = [];
          for (const relative of expected) {
            const left = await readFile(path.join(passA, relative));
            const right = await readFile(path.join(passB, relative));
            assert.ok(left.equals(right), `independent compiler bytes differ: ${relative}`);
            if (relative !== manifestRelative) {
              const record = records.get(relative);
              assert.equal(left.length, record.bytes);
              assert.equal(createHash("sha256").update(left).digest("hex"), record.sha256);
            }
            const target = path.resolve(relative);
            assert.ok(target.startsWith(`${root}${path.sep}`));
            await mkdir(path.dirname(target), { recursive: true });
            await copyFile(path.join(passA, relative), target, constants.COPYFILE_EXCL);
            hashes.push({ path: relative, bytes: left.length, sha256: createHash("sha256").update(left).digest("hex") });
          }
          await writeFile(`${work}/evidence/determinism-proof.json`, `${JSON.stringify({
            schema: "pipelinenews.news-chronology-determinism-proof.v1",
            generation,
            source_commit: process.env.GITHUB_SHA,
            byte_identical_passes: true,
            files: hashes,
          }, null, 2)}\n`);
          NODE

      - name: Verify identity counts chronology Atlas reuse and performance contract
        shell: bash
        run: |
          set -euo pipefail
          node "build/javascript/$NEWS_GENERATION-verify-v8-news-chronology-contract.mjs" \
            --root . \
            --generation "$NEWS_GENERATION" \
            --source-manifest "build/$NEWS_GENERATION-v8-fast-site-manifest.json" \
            | tee "$NEWS_WORK_ROOT/evidence/contract-proof.json"

      - name: Prove Pages and stable routes remain untouched
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee "$NEWS_WORK_ROOT/evidence/pages-boundary-proof.json"
          import importlib.util
          import json
          import os
          import subprocess
          from pathlib import Path

          root = Path.cwd().resolve()
          generation = os.environ["NEWS_GENERATION"]
          module_path = root / "atman/202608262014-build-pages.py"
          spec = importlib.util.spec_from_file_location("pipelinenews_pages_gate", module_path)
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          manifest_relative = f"build/{generation}-v8-fast-site-manifest.json"
          candidate = json.loads((root / manifest_relative).read_text())
          module.require(candidate["schema"] == module.FAST_CANDIDATE_SCHEMA, "candidate schema changed")
          module.require(candidate["generation"] == generation, "candidate generation changed")
          module.require(candidate["source_commit"] == os.environ["GITHUB_SHA"], "source binding changed")
          module.require(candidate["deployment"] == "not-authorised", "candidate was authorised")
          expected = {record["path"] for record in candidate["outputs"]}
          module.require(len(expected) == 4, "output closure changed")
          for record in candidate["outputs"]:
              relative = module.normalise_candidate_output_path(record["path"], "15:24 candidate output")
              module.require(Path(relative).name.startswith(generation), f"output generation changed: {relative}")
              module.require_no_symlink_components(root, relative, "15:24 candidate output path")
              module.verify_record(root, record, "15:24 candidate output")
          authorisation = root / "build/authorisations" / f"{generation}-v8-fast-pages-authorisation.json"
          module.require(not authorisation.exists() and not authorisation.is_symlink(), "Pages authorisation exists")
          governed_generation, _, release_manifest = module.select_release(root, "latest")
          governed = {
              "releases/current.json",
              "releases/candidate.json",
              f"releases/{governed_generation}-index.html",
          }
          governed.update(record["path"] for record in release_manifest["outputs"])
          governed.update(record["path"] for record in release_manifest["inputs"] if record["path"].startswith("releases/"))
          module.require(expected.isdisjoint(governed), "candidate overlaps the governed release")
          committed = set(subprocess.run(
              ["git", "ls-tree", "-r", "--name-only", os.environ["GITHUB_SHA"]],
              cwd=root, check=True, capture_output=True, text=True,
          ).stdout.splitlines())
          module.require(({manifest_relative} | expected).isdisjoint(committed), "generated closure entered source commit")
          workflow = (root / f".github/workflows/{generation}-news-chronology-candidate.yml").read_text()
          for forbidden in (
              "actions/" + "upload-pages-artifact@",
              "actions/" + "deploy-pages@",
              "pages" + ": write",
              "id-token" + ": write",
              "/actions/workflows/" + "pages.yml/dispatches",
          ):
              module.require(forbidden not in workflow, f"deployment capability entered workflow: {forbidden}")
          print(json.dumps({
              "schema": "pipelinenews.news-chronology-pages-boundary-proof.v1",
              "generation": generation,
              "deployment": candidate["deployment"],
              "excluded_outputs": sorted(expected),
              "authorisation_path_absent": True,
              "governed_release_generation": governed_generation,
              "governed_release_disjoint": True,
              "pages_artifact_created": False,
              "stable_route_changed": False,
              "current_pointer_changed": False,
              "globalgrid_catalogue_changed": False,
              "status": "PASS",
          }, indent=2))
          PY

      - name: Install pinned browser verifier
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Browser-proof first edition and Atlas V8 handoff
        shell: bash
        env:
          FAST_SITE_URL: http://127.0.0.1:4173/releases/202608271524-v8-fast-candidate.html
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 --directory . > "$RUNNER_TEMP/202608271524-news-http.log" 2>&1 &
          server_pid="$!"
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent --show-error "$FAST_SITE_URL" >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent --show-error "$FAST_SITE_URL" >/dev/null
          node "build/javascript/$NEWS_GENERATION-verify-v8-news-chronology-browser.mjs" \
            | tee "$NEWS_WORK_ROOT/evidence/browser-proof.json"

      - name: Enforce bounded closure and evidence sizes
        shell: bash
        run: |
          set -euo pipefail
          test "$(find "$NEWS_WORK_ROOT/pass-a" -type f | wc -l)" -eq 5
          test "$(du -sb "$NEWS_WORK_ROOT/pass-a" | cut -f1)" -lt 2000000
          test "$(du -sb "$NEWS_WORK_ROOT/evidence" | cut -f1)" -lt 2000000

      - name: Upload verified immutable closure
        uses: actions/upload-artifact@v4
        with:
          name: pipelinenews-news-chronology-closure-202608271524-${{ github.run_id }}
          path: ${{ env.NEWS_WORK_ROOT }}/pass-a
          if-no-files-found: error
          retention-days: 30

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipelinenews-news-chronology-evidence-202608271524-${{ github.run_id }}
          path: ${{ env.NEWS_WORK_ROOT }}/evidence
          if-no-files-found: error
          retention-days: 30

  commit:
    if: github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - name: Checkout exact verified source
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Configure Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Download verified immutable closure
        uses: actions/download-artifact@v4
        with:
          name: pipelinenews-news-chronology-closure-202608271524-${{ github.run_id }}
          path: ${{ env.NEWS_WORK_ROOT }}/verified-closure

      - name: Reverify closure against current main and stage only new files
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin refs/heads/main
          git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD
          git diff --quiet "$GITHUB_SHA" FETCH_HEAD -- \
            ".github/workflows/$NEWS_GENERATION-news-chronology-candidate.yml" \
            "build/javascript/$NEWS_GENERATION-verify-v8-news-chronology-browser.mjs" \
            "build/javascript/$NEWS_GENERATION-verify-v8-news-chronology-contract.mjs" \
            "index/$NEWS_GENERATION-compile-v8-news-chronology.mjs" \
            "manifests/$NEWS_GENERATION-news-chronology-candidate.json" \
            build/202608271329-v8-fast-site-manifest.json \
            releases/202608271329-v8-fast-candidate.html \
            releases/javascript/202608271329-v8-fast-runtime.js \
            releases/javascript/202608271329-atlas-v8-deep-link-cartridge.js \
            releases/data/202608271329-v8-fast-registry.json \
            releases/data/202608270844-9ab451f4bf19-v8-fast-news.json
          git switch --detach FETCH_HEAD
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { createHash } from "node:crypto";
          import { constants } from "node:fs";
          import { copyFile, mkdir, readFile, readdir } from "node:fs/promises";
          import { spawnSync } from "node:child_process";
          import path from "node:path";
          const generation = process.env.NEWS_GENERATION;
          const closure = path.resolve(process.env.NEWS_WORK_ROOT, "verified-closure");
          const manifestRelative = `build/${generation}-v8-fast-site-manifest.json`;
          const manifest = JSON.parse(await readFile(path.join(closure, manifestRelative)));
          assert.equal(manifest.generation, generation);
          assert.equal(manifest.source_commit, process.env.GITHUB_SHA);
          assert.equal(manifest.source_parent_commit, process.env.NEWS_SOURCE_PARENT);
          assert.equal(String(manifest.github_run_id), process.env.GITHUB_RUN_ID);
          assert.equal(manifest.deployment, "not-authorised");
          const expected = [manifestRelative, ...manifest.outputs.map((record) => record.path)].sort();
          assert.equal(expected.length, 5);
          async function walk(directory, base = directory) {
            const files = [];
            for (const entry of await readdir(directory, { withFileTypes: true })) {
              const filename = path.join(directory, entry.name);
              if (entry.isDirectory()) files.push(...await walk(filename, base));
              else files.push(path.relative(base, filename).split(path.sep).join("/"));
            }
            return files.sort();
          }
          assert.deepEqual(await walk(closure), expected, "artifact contains undeclared files");
          const records = new Map(manifest.outputs.map((record) => [record.path, record]));
          for (const relative of expected) {
            const source = path.join(closure, relative);
            const bytes = await readFile(source);
            if (relative !== manifestRelative) {
              const record = records.get(relative);
              assert.equal(bytes.length, record.bytes);
              assert.equal(createHash("sha256").update(bytes).digest("hex"), record.sha256);
            }
            const target = path.resolve(relative);
            assert.ok(target.startsWith(`${process.cwd()}${path.sep}`));
            await mkdir(path.dirname(target), { recursive: true });
            await copyFile(source, target, constants.COPYFILE_EXCL);
          }
          const add = spawnSync("git", ["add", "--", ...expected], { encoding: "utf8" });
          assert.equal(add.status, 0, add.stderr || add.stdout);
          const diff = spawnSync("git", ["diff", "--cached", "--name-only", "-z"], { encoding: "buffer" });
          assert.equal(diff.status, 0, diff.stderr.toString());
          assert.deepEqual(diff.stdout.toString("utf8").split("\0").filter(Boolean).sort(), expected);
          const status = spawnSync("git", ["diff", "--cached", "--name-status"], { encoding: "utf8" });
          assert.equal(status.status, 0, status.stderr);
          assert.ok(status.stdout.trim().split("\n").every((line) => line.startsWith("A\t")));
          NODE

      - name: Commit the green quarantined chronology successor
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "v8: build news chronology candidate $NEWS_GENERATION"
          git push origin HEAD:main
