name: 202608301153 Repair timestamp Pages source attestation V2
run-name: Repair immutable timestamp Pages gate from ${{ github.sha }}

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/202608301153-repair-pages-historical-source-attestation-v2.yml'
      - 'automation/202608301152-repair-pages-historical-source-attestation.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pipelinenews-202608301153-pages-source-attestation-repair
  cancel-in-progress: false

env:
  PATCHER: automation/202608301152-repair-pages-historical-source-attestation.py
  TARGET: atman/202608262014-build-pages.py

jobs:
  repair:
    name: Prove historical source attestation and publish one source repair
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout exact source boundary
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Apply and prove bounded Pages-gate repair
        run: |
          set -euo pipefail
          git fetch --no-tags origin main:refs/remotes/origin/main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          test -f "$PATCHER"
          test -f "$TARGET"
          python3 -m py_compile "$PATCHER"
          python3 "$PATCHER"
          python3 -m py_compile "$TARGET"
          git diff --check
          test "$(git diff --name-only)" = "$TARGET"
          rm -rf "$RUNNER_TEMP/pages-proof"
          python3 "$TARGET" --generation latest --timestamp-folder-release 202608300309-pipelinenews --stage "$RUNNER_TEMP/pages-proof" > "$RUNNER_TEMP/pages-proof-result.json"
          test "$(jq -r .status "$RUNNER_TEMP/pages-proof-result.json")" = CHECKED_AND_STAGED
          test "$(jq -r .timestamp_folder.release_id "$RUNNER_TEMP/pages-proof-result.json")" = 202608300309-pipelinenews
          test -f "$RUNNER_TEMP/pages-proof/releases/202608300309-pipelinenews/index.html"

      - name: Compare-and-swap source-only repair onto main
        run: |
          set -euo pipefail
          git fetch --no-tags origin main:refs/remotes/origin/main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          git add "$TARGET"
          test "$(git diff --cached --name-only)" = "$TARGET"
          git config user.name pipelinenews-pages-gate-repair-bot
          git config user.email actions@users.noreply.github.com
          git commit -m '202608301155: attest historical inputs for immutable timestamp Pages releases'
          git push origin HEAD:main
