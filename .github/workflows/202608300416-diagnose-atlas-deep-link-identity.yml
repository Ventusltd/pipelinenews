name: 202608300416 Diagnose Atlas deep-link identity

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/202608300416-diagnose-atlas-deep-link-identity.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pipelinenews-atlas-deep-link-identity-diagnosis
  cancel-in-progress: true

env:
  RELEASE_ROOT: releases/202608291447-pipelinenews
  CORE_DATA: releases/202608291447-pipelinenews/data/202608270055-8ab1807551bc-v8-fast-projects.json
  SEARCH_DATA: releases/202608291447-pipelinenews/data/202608270055-8ab1807551bc-v8-fast-search.json
  REQUESTED_REPD_REF: '16135'

jobs:
  diagnose:
    name: Find one browser-served exact REPD identity
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout exact PipelineNews source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Audit compact core, aligned search and partitions
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations
          import json
          import os
          import re
          from collections import Counter
          from pathlib import Path

          root = Path(os.environ['RELEASE_ROOT'])
          core_path = Path(os.environ['CORE_DATA'])
          search_path = Path(os.environ['SEARCH_DATA'])
          requested = os.environ['REQUESTED_REPD_REF']

          def load(path: Path):
              return json.loads(path.read_text(encoding='utf-8'))

          def rows(payload):
              if isinstance(payload, list):
                  return payload
              if not isinstance(payload, dict):
                  return []
              for key in ('projects', 'records', 'rows', 'items', 'data'):
                  value = payload.get(key)
                  if isinstance(value, list):
                      return value
              return []

          def normalise_ref(value):
              text = str(value or '').strip()
              if text.isdigit():
                  return text
              match = re.search(r'(?:GG2050-REPD-|REPD-)(\d+)$', text, re.I)
              return match.group(1) if match else ''

          def ref_of(row):
              # Compact V8-fast rows are positional arrays; field zero is repd_ref.
              if isinstance(row, (list, tuple)):
                  return normalise_ref(row[0] if row else '')
              if not isinstance(row, dict):
                  return ''
              for key in ('repd_ref', 'REPD_REF', 'ref', 'ref_id', 'reference', 'gg_project_id', 'id'):
                  value = row.get(key)
                  ref = normalise_ref(value)
                  if ref:
                      return ref
              return ''

          core_payload = load(core_path)
          search_payload = load(search_path)
          core_rows = rows(core_payload)
          search_rows = rows(search_payload)
          core_refs = [ref_of(row) for row in core_rows if ref_of(row)]

          partition_files = sorted(root.glob('data/projects/*.json'))
          partition_refs = []
          requested_locations = []
          requested_partition_rows = []
          for path in partition_files:
              payload = load(path)
              file_rows = rows(payload)
              refs = [ref_of(row) for row in file_rows if ref_of(row)]
              partition_refs.extend(refs)
              for row in file_rows:
                  if ref_of(row) == requested:
                      requested_locations.append(str(path))
                      requested_partition_rows.append(row)

          core_set = set(core_refs)
          partition_set = set(partition_refs)
          candidate = requested if requested in core_set else (core_refs[0] if core_refs else '')
          candidate_index = core_refs.index(candidate) if candidate in core_set else -1
          aligned_search_text = search_rows[candidate_index] if 0 <= candidate_index < len(search_rows) else None

          report = {
              'schema': 'pipelinenews.atlas-deep-link-identity-diagnosis.v2',
              'requested_repd_ref': requested,
              'requested_in_core': requested in core_set,
              'requested_in_partitions': requested in partition_set,
              'requested_locations': sorted(set(requested_locations)),
              'requested_partition_rows': requested_partition_rows[:2],
              'core_rows': len(core_rows),
              'core_unique_refs': len(core_set),
              'search_rows': len(search_rows),
              'search_aligned_to_core': len(search_rows) == len(core_rows),
              'partition_files': len(partition_files),
              'partition_refs': len(partition_refs),
              'partition_unique_refs': len(partition_set),
              'core_partition_identity_match': core_set == partition_set,
              'recommended_golden_repd_ref': candidate,
              'recommended_core_index': candidate_index,
              'recommended_search_text': aligned_search_text,
              'first_core_refs': core_refs[:10],
              'first_core_row': core_rows[0] if core_rows else None,
              'first_search_row': search_rows[0] if search_rows else None,
              'first_partition_row': rows(load(partition_files[0]))[0] if partition_files and rows(load(partition_files[0])) else None,
              'duplicate_core_refs': [key for key, count in Counter(core_refs).items() if count > 1][:10],
              'duplicate_partition_refs': [key for key, count in Counter(partition_refs).items() if count > 1][:10],
          }
          Path('/tmp/atlas-deep-link-identity-diagnosis.json').write_text(
              json.dumps(report, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          print(json.dumps(report, indent=2, sort_keys=True))
          if not candidate:
              raise SystemExit('No browser-served REPD identity exists')
          if len(search_rows) != len(core_rows):
              raise SystemExit('Search index is not row-aligned to core data')
          if core_set != partition_set:
              raise SystemExit('Core and partition REPD identities diverge')
          PY

      - name: Publish exact diagnosis
        if: always()
        run: |
          set -euo pipefail
          {
            echo '## PipelineNews Atlas deep-link identity diagnosis'
            echo
            if test -f /tmp/atlas-deep-link-identity-diagnosis.json; then
              echo '```json'
              cat /tmp/atlas-deep-link-identity-diagnosis.json
              echo '```'
            else
              echo 'Diagnosis report was not produced.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
