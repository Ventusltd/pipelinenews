name: Build PipelineNews Live News Discovery

on:
  workflow_dispatch:
    inputs:
      live_collect:
        description: Run the bounded live collector and retain its health ledger as an artifact
        required: false
        default: true
        type: boolean
      provider:
        description: Live discovery provider
        required: false
        default: bing
        type: choice
        options: [bing, brave, google, serper]
  push:
    branches: [main]
    paths:
      - ".github/workflows/202608270844-live-news-discovery.yml"
      - "index/202608270844-compile-v8-live-news.mjs"
      - "build/javascript/202608270844-verify-v8-live-news-contract.mjs"
      - "build/javascript/202608270844-verify-v8-live-news-browser.mjs"
      - "ui/javascript/202608270844-v8-live-news-runtime.js"
      - "data/news-discovery/202608270844-*.json"
      - "discovery/javascript/202608270844-*.mjs"
      - "discovery/tests/202608270844-*.mjs"
      - "discovery/fixtures/202608270844-*"

permissions:
  contents: write

concurrency:
  group: build-pipelinenews-live-news-discovery-202608270844
  cancel-in-progress: false

env:
  LIVE_NEWS_GENERATION: "202608270844"
  LIVE_NEWS_PARENT: "77bda8c3809d02550d06a1c4154315f56d1120fb"
  LIVE_NEWS_WORK_ROOT: "work/202608270844-live-news-discovery"

jobs:
  build-gate-record:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Configure Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Prove source lineage and PipelineNews-only scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git rev-parse HEAD^)" = "$LIVE_NEWS_PARENT"
          mkdir -p "$LIVE_NEWS_WORK_ROOT/evidence"
          git show -s --format='%H%n%P%n%T%n%ct' HEAD > "$LIVE_NEWS_WORK_ROOT/evidence/source-record.txt"
          git diff --name-only "$LIVE_NEWS_PARENT" HEAD > "$LIVE_NEWS_WORK_ROOT/evidence/source-paths.txt"
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { readFile, writeFile } from "node:fs/promises";
          const filename = process.env.LIVE_NEWS_WORK_ROOT + "/evidence/source-paths.txt";
          const paths = (await readFile(filename, "utf8")).trim().split("\n").filter(Boolean);
          assert.ok(paths.length >= 10, "timestamped source closure is incomplete");
          assert.ok(paths.every((relative) => relative.includes("202608270844")), "every successor source file must carry the 202608270844 stamp");
          for (const forbidden of [
            "releases/current.json",
            "releases/candidate.json",
            ".github/workflows/pages.yml",
            ".github/workflows/authorise-v8-fast-pages.yml",
          ]) assert.ok(!paths.includes(forbidden), `protected path changed: ${forbidden}`);
          assert.ok(paths.every((relative) => !/(^|\/)(?:companies|globalgrid2050)(?:\/|$)/iu.test(relative)), "foreign repository material entered PipelineNews");
          assert.ok(paths.every((relative) => !relative.includes("202608270055")), "rollback generation was modified");
          await writeFile(
            process.env.LIVE_NEWS_WORK_ROOT + "/evidence/scope-proof.json",
            JSON.stringify({
              schema: "pipelinenews.live-news-source-scope-proof.v1",
              source_commit: process.env.GITHUB_SHA,
              protected_parent: process.env.LIVE_NEWS_PARENT,
              changed_paths: paths,
              pipeline_news_only: true,
              rollback_untouched: true,
              deployment_authorised: false,
            }, null, 2) + "\n",
          );
          NODE

      - name: Reject an existing immutable generation
        shell: bash
        run: |
          set -euo pipefail
          test ! -e "build/$LIVE_NEWS_GENERATION-v8-fast-site-manifest.json"
          test ! -e "releases/$LIVE_NEWS_GENERATION-v8-fast-candidate.html"
          test ! -e "releases/javascript/$LIVE_NEWS_GENERATION-v8-fast-runtime.js"
          test ! -e "releases/data/$LIVE_NEWS_GENERATION-v8-fast-registry.json"
          test ! -e "data/news-discovery/$LIVE_NEWS_GENERATION-east-pye-evidence.json"

      - name: Syntax-check timestamped source
        shell: bash
        run: |
          set -euo pipefail
          node --check "index/$LIVE_NEWS_GENERATION-compile-v8-live-news.mjs"
          node --check "build/javascript/$LIVE_NEWS_GENERATION-verify-v8-live-news-contract.mjs"
          node --check "build/javascript/$LIVE_NEWS_GENERATION-verify-v8-live-news-browser.mjs"
          node --check "ui/javascript/$LIVE_NEWS_GENERATION-v8-live-news-runtime.js"
          for source in discovery/javascript/$LIVE_NEWS_GENERATION-*.mjs discovery/tests/$LIVE_NEWS_GENERATION-*.mjs; do
            node --check "$source"
          done

      - name: Run both deterministic discovery regressions
        shell: bash
        run: |
          set -euo pipefail
          test "$(find discovery/tests -maxdepth 1 -type f -name "$LIVE_NEWS_GENERATION-*.mjs" | wc -l)" -eq 2
          find discovery/tests -maxdepth 1 -type f -name "$LIVE_NEWS_GENERATION-*.mjs" -print0 | sort -z | xargs -0 -n1 node | tee "$LIVE_NEWS_WORK_ROOT/evidence/discovery-tests.txt"

      - name: Run bounded live acquisition
        if: github.event_name == 'push' || inputs.live_collect == true
        shell: bash
        env:
          LIVE_NEWS_PROVIDER: ${{ github.event_name == 'workflow_dispatch' && inputs.provider || 'bing' }}
          BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
          GOOGLE_CSE_API_KEY: ${{ secrets.GOOGLE_CSE_API_KEY }}
          GOOGLE_CSE_ID: ${{ secrets.GOOGLE_CSE_ID }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
        run: |
          set -euo pipefail
          node "discovery/javascript/$LIVE_NEWS_GENERATION-live-news-runner.mjs" --collect --provider "$LIVE_NEWS_PROVIDER" --health-out "$LIVE_NEWS_WORK_ROOT/evidence/live-collector-health.json" --ledger-out "$LIVE_NEWS_WORK_ROOT/evidence/live-candidate-ledger.json"

      - name: Compile two independent immutable candidates
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_COMMIT="$GITHUB_SHA" GITHUB_RUN_ID="$GITHUB_RUN_ID" node "index/$LIVE_NEWS_GENERATION-compile-v8-live-news.mjs" --out-root "$LIVE_NEWS_WORK_ROOT/pass-a" | tee "$LIVE_NEWS_WORK_ROOT/evidence/compiler-pass-a.json"
          SOURCE_COMMIT="$GITHUB_SHA" GITHUB_RUN_ID="$GITHUB_RUN_ID" node "index/$LIVE_NEWS_GENERATION-compile-v8-live-news.mjs" --out-root "$LIVE_NEWS_WORK_ROOT/pass-b" | tee "$LIVE_NEWS_WORK_ROOT/evidence/compiler-pass-b.json"

      - name: Byte-compare compiler passes and materialise closure
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { constants } from "node:fs";
          import { copyFile, mkdir, readFile, readdir, writeFile } from "node:fs/promises";
          import path from "node:path";
          const root = process.cwd();
          const work = process.env.LIVE_NEWS_WORK_ROOT;
          const generation = process.env.LIVE_NEWS_GENERATION;
          const passA = path.join(root, work, "pass-a");
          const passB = path.join(root, work, "pass-b");
          const manifestRelative = `build/${generation}-v8-fast-site-manifest.json`;
          const manifest = JSON.parse(await readFile(path.join(passA, manifestRelative)));
          assert.equal(manifest.source_commit, process.env.GITHUB_SHA);
          assert.equal(manifest.deployment, "not-authorised");
          assert.equal(manifest.outputs.length, 4);
          const expected = [manifestRelative, ...manifest.outputs.map((record) => record.path)].sort();
          async function walk(directory, base = directory) {
            const files = [];
            for (const entry of await readdir(directory, { withFileTypes: true })) {
              const filename = path.join(directory, entry.name);
              if (entry.isDirectory()) files.push(...await walk(filename, base));
              else files.push(path.relative(base, filename).split(path.sep).join("/"));
            }
            return files.sort();
          }
          assert.deepEqual(await walk(passA), expected, "pass A has undeclared output");
          assert.deepEqual(await walk(passB), expected, "pass B has undeclared output");
          for (const relative of expected) {
            const left = await readFile(path.join(passA, relative));
            const right = await readFile(path.join(passB, relative));
            assert.ok(left.equals(right), `independent compiler bytes differ: ${relative}`);
            const target = path.join(root, relative);
            await mkdir(path.dirname(target), { recursive: true });
            await copyFile(path.join(passA, relative), target, constants.COPYFILE_EXCL);
          }
          await writeFile(
            path.join(root, work, "evidence", "determinism-proof.json"),
            JSON.stringify({
              schema: "pipelinenews.live-news-determinism-proof.v1",
              generation,
              source_commit: process.env.GITHUB_SHA,
              byte_identical_passes: true,
              files: expected,
            }, null, 2) + "\n",
          );
          NODE

      - name: Verify compiled identity, data, performance and quarantine contract
        shell: bash
        run: |
          set -euo pipefail
          node "build/javascript/$LIVE_NEWS_GENERATION-verify-v8-live-news-contract.mjs" --root . --generation "$LIVE_NEWS_GENERATION" --source-manifest "build/$LIVE_NEWS_GENERATION-v8-fast-site-manifest.json" | tee "$LIVE_NEWS_WORK_ROOT/evidence/contract-proof.json"

      - name: Prove the successor is excluded from Pages
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee "$LIVE_NEWS_WORK_ROOT/evidence/pages-boundary-proof.json"
          import importlib.util
          import json
          import os
          from pathlib import Path
          root = Path.cwd().resolve()
          module_path = root / "atman/202608262014-build-pages.py"
          spec = importlib.util.spec_from_file_location("pipelinenews_pages_gate", module_path)
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          generation, _, release_manifest = module.select_release(root, "latest")
          release = {"release_path": f"releases/{generation}-index.html", "manifest": release_manifest}
          excluded, authorised = module.candidate_publication_boundary(root, release)
          successor = json.loads((root / f"build/{os.environ['LIVE_NEWS_GENERATION']}-v8-fast-site-manifest.json").read_text())
          expected = {record["path"] for record in successor["outputs"]}
          module.require(expected.issubset(excluded), "0844 candidate is not fully quarantined")
          module.require(expected.isdisjoint(authorised), "0844 candidate was unexpectedly authorised")
          print(json.dumps({
              "schema": "pipelinenews.v8.live-news-pages-boundary-proof.v1",
              "generation": successor["generation"],
              "deployment": successor["deployment"],
              "successor_excluded_outputs": sorted(expected),
              "all_excluded_outputs": sorted(excluded),
              "authorised_outputs": sorted(authorised),
              "pages_artifact_created": False,
              "stable_route_changed": False,
              "globalgrid_catalogue_changed": False,
          }, indent=2))
          PY

      - name: Install pinned browser verifier
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Browser-proof desktop and mobile candidate
        shell: bash
        env:
          FAST_SITE_URL: http://127.0.0.1:4173/releases/202608270844-v8-fast-candidate.html
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 --directory . > "$RUNNER_TEMP/202608270844-live-news-http.log" 2>&1 &
          server_pid="$!"
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent --show-error "$FAST_SITE_URL" >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent --show-error "$FAST_SITE_URL" >/dev/null
          node "build/javascript/$LIVE_NEWS_GENERATION-verify-v8-live-news-browser.mjs" | tee "$LIVE_NEWS_WORK_ROOT/evidence/browser-proof.json"

      - name: Stage only the verified immutable closure
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { createHash } from "node:crypto";
          import { readFile, writeFile } from "node:fs/promises";
          import { spawnSync } from "node:child_process";
          import path from "node:path";
          const generation = process.env.LIVE_NEWS_GENERATION;
          const manifestPath = `build/${generation}-v8-fast-site-manifest.json`;
          const manifest = JSON.parse(await readFile(manifestPath));
          assert.equal(manifest.source_commit, process.env.GITHUB_SHA);
          assert.equal(manifest.deployment, "not-authorised");
          const declared = manifest.outputs.map((record) => record.path);
          const expected = [manifestPath, ...declared].sort();
          assert.equal(expected.length, 5);
          assert.equal(new Set(expected).size, expected.length);
          for (const record of manifest.outputs) {
            const bytes = await readFile(record.path);
            assert.equal(bytes.length, record.bytes);
            assert.equal(createHash("sha256").update(bytes).digest("hex"), record.sha256);
          }
          const add = spawnSync("git", ["add", "--", ...expected], { encoding: "utf8" });
          assert.equal(add.status, 0, add.stderr || add.stdout);
          const diff = spawnSync("git", ["diff", "--cached", "--name-only", "-z"], { encoding: "buffer" });
          assert.equal(diff.status, 0, diff.stderr.toString());
          const staged = diff.stdout.toString("utf8").split("\0").filter(Boolean).sort();
          assert.deepEqual(staged, expected, "staged paths differ from the declared closure");
          const status = spawnSync("git", ["diff", "--cached", "--name-status"], { encoding: "utf8" });
          assert.equal(status.status, 0, status.stderr);
          assert.ok(status.stdout.trim().split("\n").every((line) => line.startsWith("A\t")), "immutable output would overwrite a path");
          await writeFile(
            path.join(process.env.LIVE_NEWS_WORK_ROOT, "evidence", "staged-closure.json"),
            JSON.stringify({ generation, source_commit: process.env.GITHUB_SHA, files: expected }, null, 2) + "\n",
          );
          NODE

      - name: Upload build and verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipelinenews-live-news-discovery-202608270844-${{ github.run_id }}
          path: ${{ env.LIVE_NEWS_WORK_ROOT }}/evidence
          if-no-files-found: error
          retention-days: 30

      - name: Commit only the green quarantined successor
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin refs/heads/main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "v8: build Live News Discovery candidate $LIVE_NEWS_GENERATION"
          git push origin HEAD:main
